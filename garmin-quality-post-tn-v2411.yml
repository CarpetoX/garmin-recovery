name: Garmin Recovery - Calidad de sueno post-TN V2.4.11

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-pipeline-main
  cancel-in-progress: false

jobs:
  improve-post-night-shift:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener rama main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cambiar solo el criterio de dia parcial tras turno nocturno
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          file = Path('advanced_analytics.py')
          source = file.read_text(encoding='utf-8')
          marker = '# V2.4.11: post-night-shift sleep may extend into the afternoon.'
          if marker in source:
              print('V2.4.11 ya instalada. No se modifica nada.')
              raise SystemExit(0)

          first = source.find('def data_quality(')
          last = source.find('\ndef pearson(', first)
          if first < 0 or last < first:
              raise SystemExit('ABORT: no se reconoce data_quality; ningun cambio publicado.')
          function = source[first:last]

          original_window = (
              '    day_start_pending = NOW.hour < 10 and (\n'
              '        not today or bool(today.get("hr_partial_day"))\n'
              '    )'
          )
          new_window = (
              '    ' + marker + '\n'
              '    # La ausencia de sueno posterior a TN no prueba un fallo de Garmin.\n'
              '    # Mantener una ventana mas amplia SOLO en dia post-TN.\n'
              '    # El modelo principal de recuperacion conserva sus bloqueos.\n'
              '    from shift_calendar import resolve_day\n'
              '    post_tn = bool(resolve_day(TODAY.isoformat()).get("post_tn"))\n'
              '    pending_limit_hour = 18 if post_tn else 10\n'
              '    day_start_pending = NOW.hour < pending_limit_hour and (\n'
              '        not today or bool(today.get("hr_partial_day"))\n'
              '    )'
          )
          old_state = '            "early_day_pending" if pending_today else "evaluated"'
          new_state = (
              '            "post_tn_sleep_pending" if post_tn and pending_today\n'
              '            else "early_day_pending" if pending_today else "evaluated"'
          )

          for label, before, after in (
              ('ventana matinal', original_window, new_window),
              ('estado descriptivo', old_state, new_state),
          ):
              count = function.count(before)
              if count != 1:
                  raise SystemExit(f'ABORT: {label}: esperada 1 coincidencia; hay {count}. No publicado.')
              function = function.replace(before, after, 1)
          patched = source[:first] + function + source[last:]
          compile(patched, str(file), 'exec')
          file.write_text(patched, encoding='utf-8')
          print('OK: modificada exclusivamente la funcion data_quality de advanced_analytics.py')
          PY

      - name: Pruebas de sueno pos-TN, periodo diurno y limites
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from unittest.mock import patch
          from zoneinfo import ZoneInfo
          import advanced_analytics as advanced

          tz = ZoneInfo('Europe/Madrid')
          previous_now, previous_today = advanced.NOW, advanced.TODAY

          def check(hour, post_tn, sleep_ok, night_samples, expected_state):
              now = datetime(2026, 10, 11, hour, 15, tzinfo=tz)
              advanced.NOW, advanced.TODAY = now, now.date()
              try:
                  row = {'hr_partial_day': True, 'sleep_window_available': sleep_ok,
                         'night_hr_samples': night_samples, 'day_hr_samples': 0}
                  with patch('shift_calendar.resolve_day', return_value={'post_tn': post_tn}):
                      output = advanced.data_quality(
                          {now.date().isoformat(): row}, [{'id': 'synthetic'}],
                          {'days': {'2026-10-10': {}}}, {}, {})
              finally:
                  advanced.NOW, advanced.TODAY = previous_now, previous_today
              assert output['today_availability_state'] == expected_state, output
              if expected_state != 'evaluated':
                  assert 'missing_sleep_window' not in output['issues'], output
                  assert 'low_night_hr_coverage' not in output['issues'], output
                  assert output['score'] <= 74, output
              return output

          check(0, False, False, 0, 'early_day_pending')
          check(14, True, False, 0, 'post_tn_sleep_pending')
          check(17, True, False, 0, 'post_tn_sleep_pending')
          check(14, True, True, 120, 'evaluated')
          normal_afternoon = check(14, False, False, 0, 'evaluated')
          assert 'missing_sleep_window' in normal_afternoon['issues']
          post_tn_late = check(19, True, False, 0, 'evaluated')
          assert 'missing_sleep_window' in post_tn_late['issues']
          print('OK: seis escenarios post-TN y sueno regular.')
          PY

      - name: Validar regresiones existentes
        shell: bash
        run: |
          python -m py_compile advanced_analytics.py
          python -m unittest -v test_morning_sleep_gate test_sleep_integration test_quality_v248
          python pipeline_regression_tests.py --stage advanced
          python monitor_v231.py

      - name: Publicar unicamente advanced_analytics.py si todo pasa
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- advanced_analytics.py
          if git diff --cached --quiet; then
            echo 'V2.4.11 ya aplicada; no hay archivos que publicar.'
            exit 0
          fi
          git commit -m 'Garmin V2.4.11: respect post-night-shift sleep windows'
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo 'ABORT: conflicto remoto, no sobrescribir.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'OK: correccion post-TN publicada.'
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'ERROR: no se pudo publicar tras cinco intentos.' >&2
          exit 1

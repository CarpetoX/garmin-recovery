      - name: Compile, regression tests, ledger audit and monitor tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m unittest -v test_morning_sleep_gate test_sleep_integration test_quality_v248 test_training_extensions test_rpe_cycle_snapshot test_archive_report_cycles test_sync_publish test_ledger_safety_v28 test_ops_metrics_v28
          python archive_report_cycles.py
          python monitor_v231.py
      - name: Commit and publish code and tests (no workflow edits)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Garmin Recovery Maintenance'
          git config user.email 'actions@github.com'
          git add -- report_delivery_gate.py monitor_v231.py ledger_safety_v28.py test_ledger_safety_v28.py ops_metrics_v28.py test_ops_metrics_v28.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No files changed.'
            exit 0
          fi
          git commit -m 'V2.8: lossless ledger writes and operational reliability KPIs'
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo 'Conflict: no remote data overwritten' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'V2.8 COMMITTED'
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'Push failed without force' >&2
          exit 1

name: Garmin Recovery V2.5 - Upgrade Once

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: garmin-v25-one-shot
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded V2.5 changes atomically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          #!/usr/bin/env python3
          """One-time conservative fixes for Garmin Recovery, run from repository root.
          The script refuses missing/ambiguous anchors and does not make partial edits.
          """
          from pathlib import Path


          def replace_once(source, old, new, name):
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f'{name}: expected one exact anchor, found {count}: {old[:85]!r}')
              return source.replace(old, new, 1)


          def patch_muscle(content):
              name = 'muscle_load.py'
              def r(old, new):
                  nonlocal content
                  content = replace_once(content, old, new, name)
              r("    'squat': ('sentadilla', 'squat', 'thruster', 'wall ball', 'goblet squat'),",
                "    'squat': ('sentadilla', 'squat', 'thruster', 'wall ball', 'goblet squat',\n"
                "              'prensa horizontal', 'prensa de piernas', 'prensa inclinada', 'leg press'),\n"
                "    'knee_flexion': ('curl femoral', 'curl de isquios', 'leg curl', 'hamstring curl'),")
              r('def pain(obj):', '''def strength_estimate(sets, equipment):
              """Estimate free-weight strength only with explicit set-level RIR.

              Session RPE must never be used as a per-set RIR estimate. Machine-stack
              kilograms are not a mechanically comparable barbell 1RM.
              """
              if equipment not in ('barbell', 'dumbbell_pair'):
                  return None, 'unsupported_equipment'
              best = None
              status = 'set_effort_not_reported'
              for item in sets:
                  if not isinstance(item, dict):
                      continue
                  reps = num(item.get('reps'))
                  kg = num(item.get('load_kg'))
                  if kg is None:
                      kg = num(item.get('weight_kg'))
                  if reps is None or kg is None or reps <= 0 or kg <= 0 or reps > 10:
                      continue
                  rir = num(item.get('reps_in_reserve'))
                  if rir is None:
                      rir = num(item.get('rir'))
                  if rir is None:
                      set_rpe = num(item.get('set_rpe'))
                      if set_rpe is not None and 0 <= set_rpe <= 10:
                          rir = 10 - set_rpe
                  if rir is None and item.get('confirmed_to_failure') is True:
                      rir = 0
                  if rir is None:
                      continue
                  if rir < 0 or rir > 2 or reps + rir > 10:
                      status = 'set_not_near_failure'
                      continue
                  estimate = kg * (1 + (reps + rir) / 30)
                  best = max(best or 0, estimate)
                  status = 'eligible'
              return (round(best, 1) if best is not None else None), status


          def pain(obj):''')
              r("                best_e1rm = None\n                for item in exercise.get('sets', []):",
                "                best_e1rm, estimate_status = strength_estimate(exercise.get('sets', []), equipment)\n"
                "                peak_load = None\n"
                "                for item in exercise.get('sets', []):")
              r("                    known_sets += count\n                    known_volume += reps * kg * count\n"
                "                    if reps <= 10:\n                        estimate = kg * (1 + reps / 30)\n"
                "                        best_e1rm = max(best_e1rm or 0, estimate)",
                "                    known_sets += count\n                    known_volume += reps * kg * count\n"
                "                    peak_load = max(peak_load or 0, kg)")
              r("                        'estimated_1rm_kg':round(best_e1rm, 1) if best_e1rm else None,\n"
                "                        'estimated_1rm_method':'Epley, reps <= 10; approximate, not tested 1RM' if best_e1rm else None,\n"
                "                        'rpe':block.get('rpe'), 'pain':pain(obj)})",
                "                        'peak_declared_load_kg':peak_load,\n"
                "                        'laterality_unconfirmed':bool(exercise.get('reps_per_leg_unconfirmed')),\n"
                "                        'estimated_1rm_kg':best_e1rm,\n"
                "                        'estimated_1rm_status':estimate_status,\n"
                "                        'estimated_1rm_method':('Epley using explicit set RIR (0-2); approximate' if best_e1rm is not None else None),\n"
                "                        'rpe':block.get('rpe'), 'pain':pain(obj)})")
              r("          'Epley estimates are approximate and not directly measured strength']}",
                "          'Estimated 1RM requires explicitly reported set-level RIR (0-2), not session RPE',\n"
                "          'Machine loads are descriptive and are not used for free-weight 1RM',\n"
                "          'Unilateral exercises with unknown side assignment are never doubled']}")
              return content


          def patch_tests(content):
              name = 'test_quality_v248.py'
              def r(old, new):
                  nonlocal content
                  content = replace_once(content, old, new, name)
              r("            'sentadilla frontal': 'squat',",
                "            'sentadilla frontal': 'squat',\n"
                "            'prensa horizontal': 'squat',\n"
                "            'curl femoral tumbado': 'knee_flexion',\n"
                "            'curl femoral de pie unilateral': 'knee_flexion',")
              r("        self.assertEqual(len(out['best_estimated_1rm_by_exercise']), 2)",
                "        # Session RPE 6 is not set RPE and cannot justify estimating a max.\n"
                "        self.assertEqual(len(out['best_estimated_1rm_by_exercise']), 0)")
              r("    def test_sensor_age_uses_actual_measurement(self):", '''    def test_explicit_set_rir_and_observed_peak(self):
                  activity = {'date': '2026-10-11', 'activity_id': 'squat-test',
                              'manual_blocks': [{'rpe': 6, 'detail_json': {'exercises': [
                                  {'name': 'sentadilla trasera', 'load_unit': 'kg_total_barra',
                                   'sets': [{'reps': 8, 'load_kg': 100},
                                            {'reps': 1, 'load_kg': 150}]},
                              ]}}]}
                  out = analyze([activity], '2026-10-11')
                  squat = out['strength_exercises'][0]
                  self.assertEqual(squat['peak_declared_load_kg'], 150)
                  self.assertEqual(squat['verified_volume_kg'], 950)
                  self.assertIsNone(squat['estimated_1rm_kg'])
                  self.assertEqual(squat['estimated_1rm_status'], 'set_effort_not_reported')
                  activity['manual_blocks'][0]['detail_json']['exercises'][0]['sets'][1]['rir'] = 1
                  confirmed = analyze([activity], '2026-10-11')['strength_exercises'][0]
                  self.assertEqual(confirmed['estimated_1rm_kg'], 160.0)

              def test_unilateral_machine_reps_are_not_doubled(self):
                  activity = {'date': '2026-10-11', 'activity_id': 'femoral-test',
                              'manual_blocks': [{'rpe': 6, 'detail_json': {'exercises': [
                                  {'name': 'curl femoral unilateral de pie',
                                   'load_unit': 'kg_indicado_maquina',
                                   'reps_per_leg_unconfirmed': True,
                                   'sets': [{'count': 4, 'reps': 8, 'load_kg': 40}]},
                              ]}}]}
                  out = analyze([activity], '2026-10-11')
                  exercise = out['strength_exercises'][0]
                  self.assertEqual(exercise['movement_pattern'], 'knee_flexion')
                  self.assertEqual(exercise['total_sets'], 4)
                  self.assertEqual(exercise['verified_volume_kg'], 1280)
                  self.assertTrue(exercise['laterality_unconfirmed'])
                  self.assertIsNone(exercise['estimated_1rm_kg'])

              def test_matching_feedback_by_id_not_just_date(self):
                  from crossfit_insights import match_feedback
                  activity = {'id': 'i196047961', 'start_date_local': '2026-10-11T11:12:57'}
                  rows = [{'ID actividad': 'another-id', 'Fecha': '2026-10-11'},
                          {'ID actividad': 'i196047961', 'Fecha': '2026-10-11'}]
                  matched, source = match_feedback(activity, rows, {})
                  self.assertEqual(source, 'sheet_id')
                  self.assertEqual(len(matched), 1)
                  self.assertEqual(matched[0]['ID actividad'], 'i196047961')

              def test_sensor_age_uses_actual_measurement(self):''')
              r("    def test_manual_dispatch_does_not_pass_as_schedule(self):", '''    def test_repository_dispatch_not_proof_of_apps_script(self):
                  now = datetime(2026, 10, 11, 11, 30, tzinfo=TZ)
                  run = {'event': 'repository_dispatch',
                         'created_at': datetime(2026, 10, 11, 8, 35, tzinfo=TZ).isoformat(),
                         'status': 'completed', 'conclusion': 'success'}
                  result = monitor.audit_slots(now, [run], lookback_hours=12)
                  self.assertEqual(result['recovered_count'], 1)
                  self.assertFalse(result['dispatch_origin_verified'])
                  self.assertFalse(result['dispatch_caller_verified'])

              def test_manual_dispatch_does_not_pass_as_schedule(self):''')
              return content


          def patch_monitor(content):
              name = 'monitor_v231.py'
              def r(old, new):
                  nonlocal content
                  content = replace_once(content, old, new, name)
              r("        'recovered_by_apps_script': recovered_apps,",
                "        'recovered_by_apps_script': recovered_apps,  # legacy event-based alias, NOT verified caller\n"
                "        'recovered_by_repository_dispatch_unverified': recovered_apps,")
              r("        'dispatch_origin_verified': True if recovered_apps else False if recovered_manual else None,",
                "        'dispatch_origin_verified': False if recovered else None,")
              r("    assert app['dispatch_origin_verified'] is True, app",
                "    assert app['dispatch_origin_verified'] is False, app")
              r("        'note': ('repository_dispatch=Apps Script backup; '\n"
                "                 'workflow_dispatch=manual; schedule=GitHub cron.'),",
                "        'note': ('repository_dispatch is compatible with Apps Script but sender unverified; '\n"
                "                 'workflow_dispatch caller unverified; only schedule confirms GitHub cron.'),")
              return content


          def main():
              updates = {}
              for name, patch in [
                  ('muscle_load.py', patch_muscle),
                  ('test_quality_v248.py', patch_tests),
                  ('monitor_v231.py', patch_monitor),
              ]:
                  source = Path(name).read_text(encoding='utf-8')
                  candidate = patch(source)
                  if candidate == source:
                      raise RuntimeError(f'{name}: no changes produced')
                  compile(candidate, name, 'exec')
                  updates[name] = candidate
              # Only write after every anchor and syntax check has succeeded.
              for name, source in updates.items():
                  Path(name).write_text(source, encoding='utf-8')
                  print(f'PATCHED {name} ({len(source)} characters)')
              print('V2.5 patch complete; run existing CI tests before any commit.')


          if __name__ == '__main__':
              main()
          PY
          python -m compileall -q .
          python -m unittest -v test_morning_sleep_gate test_sleep_integration test_quality_v248 test_training_extensions
          python monitor_v231.py

      - name: Commit code, tests and monitoring without touching workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Garmin Recovery Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add muscle_load.py test_quality_v248.py monitor_v231.py
          git commit -m 'V2.5: refine strength analytics and dispatch provenance with tests'
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo 'Conflict with concurrent data workflow; no forced write' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'V2.5 committed to main'
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Unable to push V2.5 after five attempts' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Refresh RPE analytics via Advanced Analytics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/advanced-analytics-rpe.yml/dispatches'
          req = urllib.request.Request(
              url, data=json.dumps({'ref': 'main'}).encode('utf-8'), method='POST',
              headers={'Authorization': f'Bearer {token}',
                       'Accept': 'application/vnd.github+json',
                       'X-GitHub-Api-Version': '2022-11-28',
                       'User-Agent': 'Garmin-Recovery-V25-Upgrade'})
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status != 204:
                  raise RuntimeError('Advanced Analytics dispatch failed: ' + str(response.status))
          print('Advanced Analytics workflow dispatched; CrossFit follows on its completion.')
          PY

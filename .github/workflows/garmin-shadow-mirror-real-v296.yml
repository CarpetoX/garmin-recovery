name: Garmin V2.9.6 - Espejo REAL y alta simulada (temporal)

# Manual, sin commits, sin secrets, sin llamadas a Garmin y sin alterar report_cycles.json.
# Unica salida publicada: prueba estadistica sin datos fisiologicos.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garmin-v296-mirror-real-dry-run
  cancel-in-progress: false

jobs:
  verify-real-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener main sin conservar credenciales
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar 95 pruebas del almacenamiento V2.9.6
        run: python -m unittest -q test_cycle_shards_v296 test_ledger_compact_preview_v296 test_ledger_reader_v296 test_ledger_access_v296 test_shadow_mirror_v296

      - name: Conservar SHA del original y auditar certificados
        shell: bash
        run: |
          set -euo pipefail
          sha256sum report_cycles.json > "$RUNNER_TEMP/v296-original.sha256"
          python shadow_mirror_v296.py --plan --ledger report_cycles.json

      - name: Espejo real temporal, lectura independiente y alta SINTETICA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import hashlib
          import json
          import os
          from datetime import date, timedelta
          from pathlib import Path

          from cycle_shards_v296 import ShardError, canonical_hash, encoded, load_source
          from ledger_access_v296 import read_compatible
          from shadow_mirror_v296 import prepare_candidate, verify_candidate

          source = Path('report_cycles.json')
          original, original_bytes = load_source(source)
          source_hash = hashlib.sha256(original_bytes).hexdigest()
          work = Path(os.environ['RUNNER_TEMP']) / 'garmin-v296-mirror-real-test'
          work.mkdir(exist_ok=False)
          old = work / 'initial-candidate'
          created = prepare_candidate(source, old)
          confirmed = verify_candidate(source, old)
          if created['certificates'] != len(original['cycles']) or confirmed['status'] != 'candidate_verified':
              raise SystemExit('ERROR: el candidato real no conserva todos los certificados')
          if created['production_cutover'] or created['committed']:
              raise SystemExit('ERROR: el candidato ha autorizado una escritura en produccion')

          # El lector NO recibe el original; despues comprobamos la igualdad por separado.
          unavailable = work / 'original-absent.json'
          if unavailable.exists():
              raise SystemExit('ERROR: directorio de prueba contaminado')
          reconstructed, check = read_compatible(unavailable, mode='shards_only',
                              preview_path=old / 'compact-preview.json',
                              archive_dir=old / 'archive')
          if reconstructed != original or check['certificates'] != len(original['cycles']):
              raise SystemExit('ERROR: lectura independiente desigual')
          old_files = {str(p.relative_to(old)): hashlib.sha256(p.read_bytes()).hexdigest()
                       for p in old.rglob('*') if p.is_file()}

          # Anadir UN certificado ficticio a una COPIA. Nunca a report_cycles.json.
          synthetic = copy.deepcopy(original)
          last_day = max((date.fromisoformat(c['slot_at'][:10])
                          for c in synthetic['cycles']), default=date(2026, 10, 11))
          next_day = last_day + timedelta(days=1)
          fake_id = f'{next_day.isoformat()}-0830-v296-test-only'
          if any(c['cycle_id'] == fake_id for c in synthetic['cycles']):
              raise SystemExit('ERROR: identificador de ensayo repetido')
          snap = {'synthetic': True, 'not_garmin_data': True}
          fake = {'entry_schema_version': 2, 'cycle_id': fake_id,
                  'slot_at': f'{next_day.isoformat()}T08:30:00+02:00',
                  'state': 'data_ready', 'snapshot': snap,
                  'snapshot_sha256': canonical_hash(snap)}
          synthetic['cycles'].append(fake)
          synthetic['count'] = len(synthetic['cycles'])
          simulated_source = work / 'simulated-ledger.json'
          simulated_source.write_bytes(encoded(synthetic))
          extended = work / 'extended-candidate'
          extended_result = prepare_candidate(simulated_source, extended, previous=old)
          verify_candidate(simulated_source, extended, previous=old)
          extended_ledger, _ = read_compatible(work / 'still-no-original.json',
                                mode='shards_only',
                                preview_path=extended / 'compact-preview.json',
                                archive_dir=extended / 'archive')
          if extended_ledger != synthetic or extended_result['new_certificates'] != 1:
              raise SystemExit('ERROR: el alta simulada no se ha reconstruido')
          if extended_result['preserved'] != len(original['cycles']):
              raise SystemExit('ERROR: no se han preservado todos los certificados anteriores')

          # Segunda preparacion identica: debe mantener todos los datos sin duplicar altas.
          repeated = work / 'repeated-candidate'
          repeated_result = prepare_candidate(source, repeated, previous=old)
          if (repeated_result['new_certificates'] != 0 or
                  repeated_result['preserved'] != len(original['cycles'])):
              raise SystemExit('ERROR: repeticion no idempotente')

          # Corrupcion de un certificado viejo, incluso recalculando su SHA de snapshot:
          # se debe rechazar la nueva version sin crear un candidato parcial.
          tampered = copy.deepcopy(synthetic)
          if tampered['cycles']:
              first = tampered['cycles'][0]
              first['state'] = 'altered-in-negative-test'
              negative_src = work / 'tampered-ledger.json'
              negative_src.write_bytes(encoded(tampered))
              forbidden = work / 'forbidden-candidate'
              try:
                  prepare_candidate(negative_src, forbidden, previous=old)
              except ShardError:
                  pass
              else:
                  raise SystemExit('ERROR: el espejo ha aceptado cambios en un certificado anterior')
              if forbidden.exists():
                  raise SystemExit('ERROR: ha quedado un candidato parcial tras un rechazo')

          after_files = {str(p.relative_to(old)): hashlib.sha256(p.read_bytes()).hexdigest()
                         for p in old.rglob('*') if p.is_file()}
          if old_files != after_files:
              raise SystemExit('ERROR: version anterior del espejo modificada')
          if source.read_bytes() != original_bytes:
              raise SystemExit('ERROR: report_cycles.json ha cambiado')

          summary = {
              'version': '2.9.6',
              'status': 'real_mirror_and_synthetic_append_verified',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'source_commit': os.environ.get('GITHUB_SHA'),
              'original_certificates': len(original['cycles']),
              'snapshots_verified': check['snapshots_verified'],
              'legacy_records_preserved': check['legacy_records_preserved'],
              'initial_shards': created['shard_count'],
              'initial_compact_index_bytes': (old / 'compact-preview.json').stat().st_size,
              'initial_mirror_total_bytes': sum(p.stat().st_size for p in old.rglob('*') if p.is_file()),
              'source_ledger_bytes': len(original_bytes),
              'synthetic_certificates_added': 1,
              'synthetic_certificates_total': len(extended_ledger['cycles']),
              'old_certificates_preserved_in_extension': extended_result['preserved'],
              'unchanged_shard_files_reusable': extended_result['reusable_unchanged_shards'],
              'independent_reconstruction_identical': True,
              'idempotent_repeat_verified': True,
              'rejects_old_certificate_modification': bool(original['cycles']),
              'previous_candidate_unchanged': True,
              'source_sha256': source_hash,
              'source_modified': False,
              'commit_performed': False,
              'production_cutover': False,
              'health_payload_published': False,
          }
          proof = work / 'garmin-v296-real-mirror-proof.json'
          proof.write_bytes(encoded(summary))
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as s:
              s.write('## Garmin V2.9.6 — Espejo real y alta sintetica\n\n')
              s.write('| Comprobacion | Resultado |\n|---|---|\n')
              for key, value in summary.items():
                  s.write(f'| `{key}` | `{value}` |\n')
              s.write('\n**Ensayo temporal. Sin commit, sin corte a produccion, sin datos de salud publicados.**\n')
          PY

      - name: Confirmar integridad binaria del original y ausencia de cambios
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/v296-original.sha256"
          git diff --exit-code -- report_cycles.json

      - name: Publicar solo justificante tecnico sin datos fisiologicos
        uses: actions/upload-artifact@v4
        with:
          name: garmin-v296-real-mirror-proof
          path: ${{ runner.temp }}/garmin-v296-mirror-real-test/garmin-v296-real-mirror-proof.json
          retention-days: 7
          if-no-files-found: error

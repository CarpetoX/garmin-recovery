name: Garmin Recovery Sync

on:
  workflow_dispatch:
    inputs:
      origin_source:
        description: 'Opcional: origen firmado del respaldo Apps Script'
        required: false
        type: string
      cycle_id:
        description: 'Opcional: ciclo firmado YYYY-MM-DD-HHMM'
        required: false
        type: string
      requested_at:
        description: 'Opcional: hora UTC del respaldo firmado'
        required: false
        type: string
      request_id:
        description: 'Opcional: identificador del respaldo firmado'
        required: false
        type: string
      origin_proof:
        description: 'Opcional: prueba HMAC del respaldo'
        required: false
        type: string
  # Backup independently triggered by Apps Script, once its Code.gs is configured.
  repository_dispatch:
    types: [garmin-sync]

  # Disparador principal: Apps Script firmado (apps_script/RespaldoGarmin231.gs), a la hora de cada franja.
  # El cron de GitHub llega 2–5 h tarde: queda UNO solo como último recurso diario por si Apps Script cae.
  schedule:
    - cron: "30 8 * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write

concurrency:
  group: garmin-pipeline-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: V2.9.1 - Verificar origen antes de sincronizar
        env:
          GARMIN_ORIGIN_KEY_V291: ${{ secrets.GARMIN_ORIGIN_KEY_V291 }}
        run: python garmin_dispatch_auth_v291.py --out .garmin_origin_v291.json

      - name: Obtener wellness de Intervals.icu
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: python sync_fetch_wellness.py

      - name: Obtener actividades de Intervals.icu
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: python sync_fetch_activities.py

      - name: Crear análisis profesional diario y semanal
        run: python sync_daily_analysis.py

      - name: Guardar datos de Intervals con reintentos
        shell: bash
        run: bash sync_publish.sh

      - name: V2.9 - Registrar origen verificable del run Sync
        continue-on-error: true
        run: |
          mkdir -p .lineage_current
          python pipeline_lineage_v29.py --stage sync --out .lineage_current/pipeline_lineage_v29.json
          python garmin_dispatch_auth_v291.py --attach-lineage .lineage_current/pipeline_lineage_v29.json --origin-file .garmin_origin_v291.json

      - name: V2.9 - Conservar filiacion del run Sync por 14 dias
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: garmin-lineage-v29
          path: .lineage_current/pipeline_lineage_v29.json
          retention-days: 14
          if-no-files-found: error

name: Upgrade Garmin Recovery V2.4.2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-pipeline-main
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar V2.4.2
        run: python upgrade_v242.py

      - name: Validar V2.4.2
        run: |
          python -m py_compile recovery_reliability.py convergence_domains_v242.py pipeline_regression_tests.py
          python convergence_domains_v242.py
          python pipeline_regression_tests.py --stage manual

      - name: Publicar V2.4.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Garmin Recovery Bot"
          git config user.email "actions@github.com"

          git add recovery_reliability.py convergence_domains_v242.py pipeline_regression_tests.py

          if git diff --cached --quiet; then
            echo "Sin cambios V2.4.2 que publicar."
            exit 0
          fi

          git commit -m "Garmin Recovery V2.4.2 independent-domain convergence"

          for attempt in 1 2 3 4 5; do
            echo "Intento de publicación $attempt/5"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "No se pudo publicar V2.4.2 tras cinco intentos." >&2
          exit 1

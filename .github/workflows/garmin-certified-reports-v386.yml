name: Garmin V3.8.6 - Historical Quality Verification

on:
  workflow_dispatch:
    inputs:
      cycle_id:
        description: 'Optional certified cycle ID (blank = all eligible cycles)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: garmin-certified-reports-v386
  cancel-in-progress: false

jobs:
  historical-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests, including certified historical cycles
        run: python -m unittest -v test_cycle_report_v386 test_cycle_report_v385 test_cycle_report_batch_v384 test_cycle_report_publisher_v383 test_cycle_real_integration_v382
      - name: Generate compatibility reports into runner artifact directory
        env:
          CYCLE_ID: ${{ inputs.cycle_id }}
        run: |
          set -euo pipefail
          if [[ -n "${CYCLE_ID:-}" ]]; then
            python cycle_report_batch_v386.py --ledger report_cycles.json --outdir certified_cycle_reports_v386 --cycle-id "$CYCLE_ID"
          else
            python cycle_report_batch_v386.py --ledger report_cycles.json --outdir certified_cycle_reports_v386
          fi
      - name: Upload reports and quarantine manifest
        uses: actions/upload-artifact@v4
        with:
          name: garmin-certified-reports-v386-${{ github.run_id }}
          path: certified_cycle_reports_v386/
          if-no-files-found: error
          retention-days: 30

name: Upgrade Garmin Recovery V2.4.3 Maintenance

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-pipeline-main
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar V2.4.3
        run: python upgrade_v243.py

      - name: Validar sintaxis y regresiones actuales
        run: |
          python -m py_compile report_delivery_gate.py pipeline_regression_tests.py convergence_domains_v242.py
          python pipeline_regression_tests.py --stage manual

      - name: Probar migración legacy schema 1 -> schema 2
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          import pipeline_regression_tests as regress
          from report_delivery_gate import append_ready_cycle

          legacy = {
              "schema_version": 1,
              "cycles": [{
                  "cycle_id": "2026-10-09-1645",
                  "ready_at": "2026-10-09T17:00:25+02:00",
                  "slot_at": "2026-10-09T16:45:00+02:00",
                  "target_report_at": "17:00",
                  "sync_run_id": 1,
                  "crossfit_run_id": 4,
                  "state": "data_ready",
                  "notification_delivery": "unverified"
              }],
              "count": 1
          }
          cert = {
              "cycle_id": "2099-01-01-0830",
              "verified_at": "2099-01-01T08:40:00+01:00",
              "slot_at": "2099-01-01T08:30:00+01:00",
              "target_report_at": "08:45",
              "chain": {"sync": {"id": 11}, "crossfit": {"id": 14}},
              "source_generated_at": {},
              "measurement_provenance": {},
              "recovery_state": "provisional",
              "recovery_confidence": "medium"
          }

          with tempfile.TemporaryDirectory() as td:
              path = Path(td) / "report_cycles.json"
              path.write_text(json.dumps(legacy), encoding="utf-8")
              assert append_ready_cycle(cert, path=path) is True
              migrated = json.loads(path.read_text(encoding="utf-8"))

              assert migrated["schema_version"] == 2
              assert migrated["ledger_version"] == "2.3.4"
              assert migrated["count"] == 2

              old, new = migrated["cycles"]
              assert old["entry_schema_version"] == 1
              assert old["legacy_without_snapshot"] is True
              assert old["snapshot_status"] == "legacy_unavailable"
              assert "snapshot" not in old
              assert "snapshot_sha256" not in old

              assert new["entry_schema_version"] == 2
              assert isinstance(new["snapshot"], dict)
              assert len(new["snapshot_sha256"]) == 64

              errors, warnings = [], []
              regress.test_cycle_snapshots(migrated, errors, warnings)
              assert not errors, errors

          print("V2.4.3 legacy ledger migration test: OK")
          PY

      - name: Publicar V2.4.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Garmin Recovery Bot"
          git config user.email "actions@github.com"

          git add report_delivery_gate.py pipeline_regression_tests.py

          if git diff --cached --quiet; then
            echo "Sin cambios V2.4.3 que publicar."
            exit 0
          fi

          git commit -m "Fix schema 1 ledger migration and activate domain regression"

          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

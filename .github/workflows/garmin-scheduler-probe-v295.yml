name: Garmin V2.9.5 - Scheduler Probe TEMPORAL

# Diagnostico aislado: NO inicia Sync, NO lee Garmin, NO hace commits.
# Retirar despues de observar el programador durante 12-24 horas.
on:
  workflow_dispatch:
  schedule:
    # Dos registros independientes: uno en zona Madrid y otro en UTC.
    - cron: '17 * * * *'
      timezone: 'Europe/Madrid'
    - cron: '43 * * * *'

permissions:
  contents: read

jobs:
  scheduler-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Registrar tipo de evento, horario y retraso
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REPOSITORY_REF: ${{ github.ref }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          local = now.astimezone(ZoneInfo("Europe/Madrid"))
          event = os.environ.get("EVENT_NAME", "")
          expression = os.environ.get("EVENT_SCHEDULE", "")
          if event == "schedule" and expression == "17 * * * *":
              source = "cron_con_timezone_madrid"
          elif event == "schedule" and expression == "43 * * * *":
              source = "cron_utc_sin_timezone"
          elif event == "workflow_dispatch":
              source = "prueba_manual_no_demuestra_cron"
          else:
              source = "evento_inesperado"

          result = {
              "version": "2.9.5",
              "event": event,
              "cron_expression": expression or None,
              "source": source,
              "utc_observed": now.isoformat(),
              "madrid_observed": local.isoformat(),
              "repository_ref": os.environ.get("REPOSITORY_REF", ""),
              "run_id": os.environ.get("WORKFLOW_RUN_ID", ""),
              "no_garmin_sync": True,
              "no_repository_write": True,
          }
          print(json.dumps(result, ensure_ascii=False))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## Diagnostico GitHub cron V2.9.5\n\n")
                  for key, value in result.items():
                      fh.write(f"- **{key}**: `{value}`\n")
                  fh.write("\nUna ejecucion `workflow_dispatch` no verifica el cron.\n")
          PY

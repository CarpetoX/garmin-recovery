name: Garmin Recovery - Corregir procedencia monitor V2.4.12

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-pipeline-main
  cancel-in-progress: false

jobs:
  patch-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo principal
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ajustar solo atribucion del monitor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('monitor_v231.py')
          src = path.read_text(encoding='utf-8')
          marker = '# V2.4.12: workflow_dispatch actor unverified; event type is not caller identity.'
          if marker in src:
              print('v2.4.12: ya instalada; no hay cambios de código.')
              raise SystemExit(0)

          replacements = [
              (
                  "        'recovered_by_manual': recovered_manual,",
                  "        'recovered_by_manual': recovered_manual,  # legado: etiqueta basada solo en evento\n"
                  "        'recovered_by_unattributed': recovered_manual,\n"
                  "        'dispatch_caller_verified': False if recovered else None,",
              ),
              (
                  "        dispatch_origin = ('apps_script_backup' if slots.get('recovered_by_apps_script')\n"
                  "                           else 'manual' if slots.get('recovered_by_manual')\n"
                  "                           else 'unknown')",
                  "        " + marker + "\n"
                  "        dispatch_origin = ('repository_dispatch_caller_unverified'\n"
                  "                           if slots.get('recovered_by_apps_script')\n"
                  "                           else 'workflow_dispatch_caller_unverified'\n"
                  "                           if slots.get('recovered_by_unattributed') else 'unknown')",
              ),
              (
                  "                       'dispatch_origin_verified': slots.get('dispatch_origin_verified')})",
                  "                       'dispatch_origin_verified': False,\n"
                  "                       'dispatch_caller_verified': False,\n"
                  "                       'evidence_level': 'github_event_type_only',\n"
                  "                       'note': ('El tipo workflow_dispatch no distingue Apps Script de '\n"
                  "                                'una persona; ningún actor está certificado.')})",
              ),
          ]

          newsrc = src
          for old, new in replacements:
              count = newsrc.count(old)
              if count != 1:
                  raise SystemExit(
                      f'ABORT: esperaba 1 coincidencia exacta; halladas {count}: '
                      f'{old[:75]!r}. Nada publicado.'
                  )
              newsrc = newsrc.replace(old, new, 1)
          compile(newsrc, str(path), 'exec')
          path.write_text(newsrc, encoding='utf-8')
          print('OK: solo monitor_v231.py modificado; otros archivos intactos.')
          PY

      - name: Verificar pruebas anteriores
        run: |
          python -m py_compile monitor_v231.py
          python monitor_v231.py
          python -m unittest -v test_morning_sleep_gate test_sleep_integration test_quality_v248 test_training_extensions

      - name: Verificar procedencia no acreditada
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import monitor_v231 as monitor

          zone = ZoneInfo('Europe/Madrid')
          now = datetime(2026, 10, 11, 11, 30, tzinfo=zone)
          slots = monitor.due_slots(now)
          assert len(slots) >= 2, slots
          runs = []
          for i, slot in enumerate(slots):
              runs.append({
                  'id': 8000 + i,
                  'event': 'workflow_dispatch' if i == len(slots)-1 else 'schedule',
                  'created_at': (slot + timedelta(minutes=5)).isoformat(),
                  'updated_at': (slot + timedelta(minutes=6)).isoformat(),
                  'status': 'completed', 'conclusion': 'success',
              })
          audit = monitor.audit_slots(now, runs)
          assert audit['state'] == 'recovered', audit
          assert audit['matched'] == len(slots) - 1, audit
          assert audit['recovered_by_unattributed'] == [slots[-1].isoformat()], audit
          assert audit['recovered_by_manual'] == audit['recovered_by_unattributed']
          assert audit['dispatch_caller_verified'] is False
          assert audit['manual_runs_counted_as_schedule'] is False

          def fetcher(repo, token, wf):
              return runs if wf == 'sync.yml' else []
          result = monitor.enhance_monitor({'alerts': [], 'status': 'ok'},
                                           now, 'test/repo', 'test-token', fetcher)
          alerts = [a for a in result['alerts']
                    if a.get('code') == 'cron_missed_dispatch_recovered']
          assert len(alerts) == 1, result
          assert alerts[0]['dispatch_origin'] == 'workflow_dispatch_caller_unverified', alerts
          assert alerts[0]['dispatch_origin_verified'] is False
          assert alerts[0]['dispatch_caller_verified'] is False
          assert alerts[0]['severity'] == 'warning'
          print('OK: respaldo no atribuido falsamente a un humano ni a Apps Script.')
          PY

      - name: Publicar solo la correccion del monitor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitor_v231.py
          if git diff --cached --quiet; then
            echo 'El monitor ya estaba corregido. No se modifica el repositorio.'
            exit 0
          fi
          git commit -m 'Garmin V2.4.12: avoid false workflow dispatch actor attribution'
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo 'Conflicto de actualizacion: no se sobrescribe main.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'Monitor v2.4.12 publicado; cambios verificados.'
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'No se pudo publicar el monitor tras los reintentos.' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done

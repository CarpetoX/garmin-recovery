name: Garmin Recovery - Calidad al inicio del dia V2.4.10

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-pipeline-main
  cancel-in-progress: false

jobs:
  quality-day-start:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Distinguir lecturas pendientes de errores reales al comenzar el dia
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          
          p = Path('advanced_analytics.py')
          original = p.read_text(encoding='utf-8')
          marker = '# V2.4.10: early-day Garmin readings are pending, not missing.'
          if marker in original:
              print('V2.4.10 ya aplicada. No es necesario repetir cambios.')
              raise SystemExit(0)
          
          start = original.find('def data_quality(')
          end = original.find('\ndef pearson(', start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('ABORT: no se puede delimitar data_quality; no se publican cambios.')
          quality = original[start:end]
          
          def patch(needle, replacement, label):
              global quality
              count = quality.count(needle)
              if count != 1:
                  raise SystemExit(f'ABORT: {label} encontrado {count} veces en data_quality (se esperaba 1). No publicado.')
              quality = quality.replace(needle, replacement, 1)
          
          patch(
              '    score = 100\n\n    if not today:\n',
              '    ' + marker + '\n'
              '    # Las lecturas del día no se consideran definitivas al inicio de la jornada.\n'
              '    # La certificación de sueño y recuperación sigue siendo independiente.\n'
              '    day_start_pending = NOW.hour < 10 and (\n'
              '        not today or bool(today.get("hr_partial_day"))\n'
              '    )\n'
              '    pending_today = []\n\n'
              '    score = 100\n\n    if not today:\n',
              'insertar marcador y ventana matinal',
          )
          
          patch(
              '    if not today:\n'
              '        issues.append("missing_today_record")\n'
              '        score -= 30\n',
              '    if not today:\n'
              '        if day_start_pending:\n'
              '            pending_today.append("today_record_pending_day_start")\n'
              '        else:\n'
              '            issues.append("missing_today_record")\n'
              '            score -= 30\n',
              'sin registro nuevo',
          )
          
          patch(
              '    if (\n'
              '        today\n'
              '        and not today.get(\n'
              '            "sleep_window_available"\n'
              '        )\n'
              '    ):\n'
              '        issues.append("missing_sleep_window")\n'
              '        score -= 15\n',
              '    if (\n'
              '        today\n'
              '        and not today.get(\n'
              '            "sleep_window_available"\n'
              '        )\n'
              '    ):\n'
              '        if day_start_pending:\n'
              '            pending_today.append("sleep_window_pending_day_start")\n'
              '        else:\n'
              '            issues.append("missing_sleep_window")\n'
              '            score -= 15\n',
              'sueño al inicio del día',
          )
          
          patch(
              '    if (\n'
              '        today\n'
              '        and today.get(\n'
              '            "night_hr_samples",\n'
              '            0,\n'
              '        ) < 60\n'
              '    ):\n'
              '        issues.append("low_night_hr_coverage")\n'
              '        score -= 10\n',
              '    if (\n'
              '        today\n'
              '        and today.get(\n'
              '            "night_hr_samples",\n'
              '            0,\n'
              '        ) < 60\n'
              '    ):\n'
              '        if day_start_pending:\n'
              '            pending_today.append("night_hr_pending_day_start")\n'
              '        else:\n'
              '            issues.append("low_night_hr_coverage")\n'
              '            score -= 10\n',
              'FC nocturna al inicio del día',
          )
          
          patch(
              '    latest = {}\n\n    for name, obj in advanced_inputs.items():',
              '    # Las lecturas pendientes no equivalen a una recuperación definitiva.\n'
              '    # No elevar artificialmente la confianza de una jornada incompleta.\n'
              '    if pending_today:\n'
              '        score = min(score, 74)\n\n'
              '    latest = {}\n\n    for name, obj in advanced_inputs.items():',
              'limitar confianza con mediciones pendientes',
          )
          
          patch(
              '        "issues": issues,\n'
              '        "coverage_28d": coverage,',
              '        "issues": issues,\n'
              '        "pending_today": pending_today,\n'
              '        "today_availability_state": (\n'
              '            "early_day_pending" if pending_today else "evaluated"\n'
              '        ),\n'
              '        "coverage_28d": coverage,',
              'estado explicativo de disponibilidad',
          )
          
          updated = original[:start] + quality + original[end:]
          compile(updated, str(p), 'exec')
          p.write_text(updated, encoding='utf-8')
          print('OK: advanced_analytics.py actualizado; sin cambios en datos o modelos de recuperación.')
          PY

      - name: Probar inicio de dia, disponibilidad y ausencia real de datos
        shell: bash
        run: |
          python -m py_compile advanced_analytics.py
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import advanced_analytics as aa

          original_now, original_today = aa.NOW, aa.TODAY
          madrid = ZoneInfo('Europe/Madrid')

          def evaluate(hour, sleep_ok=False, night_samples=0, partial=True):
              now = datetime(2026, 10, 11, hour, 9, tzinfo=madrid)
              aa.NOW, aa.TODAY = now, now.date()
              rec = {
                  'hr_partial_day': partial,
                  'sleep_window_available': sleep_ok,
                  'night_hr_samples': night_samples,
                  'day_hr_samples': 0,
              }
              try:
                  return aa.data_quality(
                      {aa.TODAY.isoformat(): rec},
                      [{'id': 'synthetic-activity'}],
                      {'days': {'2026-10-10': {}}}, {}, {}
                  )
              finally:
                  aa.NOW, aa.TODAY = original_now, original_today

          midnight = evaluate(0)
          assert midnight['today_availability_state'] == 'early_day_pending'
          assert {'sleep_window_pending_day_start',
                  'night_hr_pending_day_start'} <= set(midnight['pending_today'])
          assert 'missing_sleep_window' not in midnight['issues']
          assert 'low_night_hr_coverage' not in midnight['issues']
          assert midnight['score'] <= 74
          assert midnight['confidence'] != 'high'

          morning = evaluate(8)
          assert morning['today_availability_state'] == 'early_day_pending'

          observed = evaluate(8, sleep_ok=True, night_samples=120)
          assert not observed['pending_today']
          assert observed['today_availability_state'] == 'evaluated'

          overdue = evaluate(12)
          assert 'missing_sleep_window' in overdue['issues']
          assert 'low_night_hr_coverage' in overdue['issues']
          assert not overdue['pending_today']

          print('OK: medianoche, pos-TN temprano, datos reales y ausencia tardia.')
          PY

      - name: Validar regresiones existentes y monitor
        run: |
          python -m compileall -q .
          python -m unittest -v test_morning_sleep_gate test_sleep_integration test_quality_v248
          python pipeline_regression_tests.py --stage advanced
          python monitor_v231.py

      - name: Publicar unicamente la correccion comprobada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add advanced_analytics.py
          if git diff --cached --quiet; then
            echo 'La correccion V2.4.10 ya estaba aplicada; no se publica nada.'
            exit 0
          fi
          git commit -m 'Garmin V2.4.10: distinguish pending day-start sensor data'
          for attempt in 1 2 3 4 5; do
            echo "Intento de publicacion $attempt/5"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo 'Conflicto de cambios. No se sobrescriben datos.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'V2.4.10 publicada correctamente.'
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'No se pudo publicar V2.4.10 tras cinco intentos.' >&2
          exit 1

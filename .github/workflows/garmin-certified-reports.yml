name: Garmin V3.8.8 - Certified Reports Manual Verification

on:
  workflow_dispatch:
    inputs:
      cycle_id:
        description: 'Optional certified cycle ID (blank = all eligible cycles)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: garmin-certified-reports-v388-manual
  cancel-in-progress: false

jobs:
  certified-reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate certified report regression
        run: python -m unittest -v test_cycle_report_v386 test_cycle_real_integration_v382
      - name: Generate certified reports (artifact only)
        env:
          CYCLE_ID: ${{ inputs.cycle_id }}
        run: |
          set -euo pipefail
          if [[ -n "${CYCLE_ID:-}" ]]; then
            python -m garmin_recovery.cycle_report_batch --ledger report_cycles.json --outdir certified_cycle_reports_v386 --cycle-id "$CYCLE_ID"
          else
            python -m garmin_recovery.cycle_report_batch --ledger report_cycles.json --outdir certified_cycle_reports_v386
          fi
      - name: Upload reports and quarantine manifest
        uses: actions/upload-artifact@v4
        with:
          name: garmin-certified-reports-manual-v388-${{ github.run_id }}
          path: certified_cycle_reports_v386/
          if-no-files-found: error
          retention-days: 30

name: Upgrade Garmin Recovery V2.4.4 Traceability

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-pipeline-main
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar V2.4.4
        run: python upgrade_v244.py

      - name: Validar V2.4.4
        run: |
          python -m py_compile monitor_v231.py report_delivery_gate.py
          python monitor_v231.py

      - name: Publicar Python V2.4.4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Garmin Recovery Bot"
          git config user.email "actions@github.com"

          git add monitor_v231.py report_delivery_gate.py

          if git diff --cached --quiet; then
            echo "Sin cambios V2.4.4 que publicar."
            exit 0
          fi

          git commit -m "Add explicit Apps Script backup provenance"

          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done

          exit 1

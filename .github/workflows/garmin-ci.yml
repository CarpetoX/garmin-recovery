name: Garmin Recovery CI

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.sh'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - '**.sh'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garmin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check all Python source files
        run: python -m compileall -q .

      - name: Install pinned YAML parser for workflow validation
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'

      - name: Validate workflow YAML, triggers and pipeline topology
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          class StrictLoader(yaml.BaseLoader):
              def construct_mapping(self, node, deep=False):
                  seen = set()
                  for key_node, _ in node.value:
                      key = self.construct_object(key_node, deep=deep)
                      if key in seen:
                          raise ValueError(f"Duplicate YAML key: {key!r}")
                      seen.add(key)
                  return super().construct_mapping(node, deep=deep)

          folder = Path('.github/workflows')
          workflows = {}
          for file in sorted(folder.glob('*.yml')):
              doc = yaml.load(file.read_text(encoding='utf-8'), Loader=StrictLoader)
              assert isinstance(doc, dict), f'{file}: invalid YAML document'
              assert isinstance(doc.get('on'), dict), f'{file}: missing event configuration'
              assert isinstance(doc.get('jobs'), dict) and doc['jobs'], f'{file}: missing jobs'
              assert doc.get('permissions'), f'{file}: missing explicit token permissions'
              workflows[file.name] = doc

          required = {
              'sync.yml', 'garmin-heart-rate.yml',
              'advanced-analytics-rpe.yml', 'crossfit-insights.yml',
              'monitor-monthly.yml', 'garmin-ci.yml',
          }
          assert required <= workflows.keys(), f'Missing workflows: {required - workflows.keys()}'
          for child, parent in (
              ('garmin-heart-rate.yml', 'Garmin Recovery Sync'),
              ('advanced-analytics-rpe.yml', 'Garmin Heart Rate Enrichment'),
              ('crossfit-insights.yml', 'Garmin Advanced Analytics'),
          ):
              parents = workflows[child]['on']['workflow_run']['workflows']
              assert parent in parents, f'{child}: missing workflow_run parent {parent}'

          sync = workflows['sync.yml']['on']
          assert 'workflow_dispatch' in sync
          assert 'garmin-sync' in sync['repository_dispatch']['types']
          schedules = sync['schedule']
          assert len(schedules) == 3
          assert [entry['cron'] for entry in schedules] == [
              '30 8 * * *', '45 16 * * *', '45 22 * * *',
          ], 'Sync slots were unexpectedly changed'
          assert all(entry.get('timezone') == 'Europe/Madrid' for entry in schedules)
          monitor = workflows['monitor-monthly.yml']['on']
          assert 'garmin-monitor' in monitor['repository_dispatch']['types']
          ci = workflows['garmin-ci.yml']['on']
          assert 'push' in ci and 'pull_request' in ci and 'workflow_dispatch' in ci
          assert 'schedule' not in ci, 'CI must not consume scheduled pipeline cycles'

          # V2.9.6: el espejo se dispara fuera de la cadena workflow_run.
          shadow = workflows['garmin-shadow-publish-v296.yml']['on']
          assert 'workflow_dispatch' in shadow, 'Manual shadow fallback removed'
          assert shadow['repository_dispatch']['types'] == ['garmin-shadow-publish']
          assert 'workflow_run' not in shadow and 'schedule' not in shadow
          steps = workflows['monitor-monthly.yml']['jobs']['monitor']['steps']
          dispatcher = [x for x in steps if 'shadow_autodispatch_v296.py' in x.get('run', '')]
          assert len(dispatcher) == 1 and dispatcher[0].get('if') == 'success()'

          # V2.9.7: nueva telemetria opcional, nunca bloquea el espejo.
          clarity = [x for x in steps if 'monitor_clarity_v297.py' in x.get('run', '')]
          assert len(clarity) == 1 and clarity[0].get('continue-on-error') == 'true'
          assert steps.index(clarity[0]) < steps.index(dispatcher[0])
          # V3.6.1: CI comprueba el generador y su contrato de publicacion opcional.
          crossfit_steps = workflows['crossfit-insights.yml']['jobs']['crossfit']['steps']
          guard = [x for x in crossfit_steps if 'crossfit_report_guard_v361.py' in x.get('run', '')]
          assert len(guard) == 1 and guard[0].get('continue-on-error') == 'true'
          assert any('crossfit_report_status_v361.json' in x.get('run', '') for x in crossfit_steps)
          # V3.9.0: monitor-linked certified reports, no duplicate workflow_run.
          report_jobs = workflows['monitor-monthly.yml']['jobs']
          assert 'certified-reports-after-monitor' in report_jobs
          certified = report_jobs['certified-reports-after-monitor']
          assert certified.get('needs') == 'monitor'
          assert certified.get('if') == ("$" + "{{ needs.monitor.result == 'success' }}")
          assert certified.get('permissions', {}).get('contents') == 'read'
          report_steps = certified.get('steps', [])
          assert any('cycle_report_batch_v386.py' in x.get('run', '') for x in report_steps)
          assert any(x.get('uses', '').startswith('actions/upload-artifact@') for x in report_steps)
          manual = workflows['garmin-certified-reports.yml']['on']
          assert 'workflow_dispatch' in manual
          assert 'workflow_run' not in manual and 'schedule' not in manual
          # V4.0.1: visual preview remains strictly parallel, read-only and optional.
          v40 = report_jobs['v40-preview-after-monitor']
          assert v40.get('needs') == 'monitor'
          assert v40.get('if') == ("$" + "{{ needs.monitor.result == 'success' }}")
          assert v40.get('permissions', {}).get('contents') == 'read'
          assert v40.get('continue-on-error') == 'true'
          v40_commands = '\n'.join(str(x.get('run') or '') for x in v40.get('steps', []))
          for source in ('garmin_report_v40.py', 'report_quality_compare_v401.py', 'report_visual_v401.py', 'report_visual_v402.py'):
              assert source in v40_commands, f'V4.0.1 missing command: {source}'
          assert any(x.get('uses', '').startswith('actions/upload-artifact@') for x in v40.get('steps', []))
          assert 'workflow_run' not in workflows['monitor-monthly.yml']['on']
          print(f'OK: {len(workflows)} workflows parse correctly; triggers and chain validated.')
          PY

      - name: Validate Sync publication shell syntax
        run: bash -n sync_publish.sh

      - name: Tests for morning reports, post-night-shift sleep, strength and RPE cycle snapshots
        run: python -m unittest -v test_morning_sleep_gate test_sleep_integration test_quality_v248 test_training_extensions test_rpe_cycle_snapshot test_archive_report_cycles test_sync_publish test_ledger_safety_v28 test_ops_metrics_v28 test_pipeline_lineage_v29 test_json_contracts_v30 test_training_trends_v31 test_performance_enhancements_v35 test_garmin_dispatch_auth_v291 test_origin_monitor_v292 test_monitor_origin_integration_v292 test_reliability_history_v294 test_cycle_shards_v296 test_ledger_compact_preview_v296 test_ledger_reader_v296 test_ledger_access_v296 test_shadow_mirror_v296 test_report_monitor_v34 test_shadow_autodispatch_v296 test_monitor_clarity_v297 test_crossfit_report_v36 test_crossfit_report_guard_v361 test_report_cycle_guard_v37 test_report_cycle_integration_v371 test_cycle_observer_v373 test_cycle_snapshot_report_v38 test_cycle_visual_report_v381 test_cycle_visual_report_v382

      - name: Validate real historical V3.8.2 report against pinned cycle snapshot
        run: python -m unittest -v test_cycle_real_integration_v382

      - name: V3.8.3 - Test safe offline report publisher
        run: python -m unittest -v test_cycle_report_publisher_v383

      - name: V3.9.0 - Certified report regression suite
        run: python -m unittest -v test_cycle_report_v386 test_cycle_report_v385 test_cycle_report_batch_v384 test_cycle_report_publisher_v383 test_cycle_real_integration_v382

      - name: V3.9.1.2 - Interpretation and enriched report regression suite
        run: python -m unittest -v test_report_interpretation_v391 test_cycle_report_enriched_v391

      - name: V3.9.2.1 - Enriched publisher regression suite
        run: python -m unittest -v test_cycle_report_publisher_v392

      - name: V4.0.1 - Compare V4 reports against V3.9 with certified snapshots
        run: python -m unittest -v test_garmin_report_v40 test_report_quality_compare_v401 test_report_visual_v401

      - name: V4.0.2 - Verify visual trends, calendar, strength, sleep and intensity
        run: python -m unittest -v test_report_visual_data_v402 test_report_visual_v402

      - name: Audit certificate ledger hashes without modifying records
        run: python archive_report_cycles.py

      - name: Verify midnight and partial-day regression scenarios
        run: |
          python - <<'PY'
          from pipeline_regression_tests import test_partial_day

          def check(latest, generated, flag, expected_error=None, expected_warning=None,
                    excluded=1):
              hr = {'days': {latest: {'partial_day': True}}}
              advanced = {'robust_trends': {
                  w: {'metrics': {'daytime_hr': {'partial_days_excluded': excluded}}}
                  for w in ('3d', '7d', '28d')
              }}
              quality = {'generated_at': generated,
                         'today': {'heart_rate_partial_day': flag,
                                   'day_hr_samples': 0, 'night_hr_samples': 0}}
              errors, warnings = [], []
              test_partial_day(hr, advanced, quality, errors, warnings)
              if expected_error is None:
                  assert not errors, (latest, generated, errors)
              else:
                  assert any(x.startswith(expected_error) for x in errors), errors
              if expected_warning is None:
                  assert not warnings, (latest, generated, warnings)
              else:
                  assert any(x.startswith(expected_warning) for x in warnings), warnings

          check('2026-10-10', '2026-10-10T23:55:00+02:00', True)
          check('2026-10-10', '2026-10-11T00:01:00+02:00', False,
                expected_warning='partial_day_hr_source_behind_quality_date')
          check('2026-10-11', '2026-10-11T00:09:00+02:00', True)
          check('2026-10-10', '2026-10-10T23:55:00+02:00', False,
                expected_error='partial_day_quality_flag_lost')
          check('2026-10-10', '2026-10-09T23:00:00+02:00', False,
                expected_error='partial_day_quality_outdated')
          check('2026-10-10', 'invalid-date', False,
                expected_error='partial_day_quality_date_missing')
          check('2026-10-10', '2026-10-10T23:55:00+02:00', True,
                expected_error='partial_day_not_excluded_from_daytime_trend', excluded=0)
          print('OK: seven midnight/partial-day regression scenarios.')
          PY

      - name: Validate pending sleep at midnight and after night shifts
        run: |
          python - <<'PYCODE'
          from datetime import datetime
          from unittest.mock import patch
          from zoneinfo import ZoneInfo
          import advanced_analytics as aa
          tz = ZoneInfo('Europe/Madrid')
          saved_now, saved_today = aa.NOW, aa.TODAY

          def evaluate(hour, post_tn, sleep=False, night_samples=0):
              now = datetime(2026, 10, 11, hour, 30, tzinfo=tz)
              aa.NOW, aa.TODAY = now, now.date()
              try:
                  row = {'hr_partial_day': True,
                         'sleep_window_available': sleep,
                         'night_hr_samples': night_samples,
                         'day_hr_samples': 0}
                  with patch('shift_calendar.resolve_day',
                             return_value={'post_tn': post_tn}):
                      return aa.data_quality(
                          {now.date().isoformat(): row},
                          [{'id': 'synthetic'}], {'days': {'2026-10-10': {}}}, {}, {})
              finally:
                  aa.NOW, aa.TODAY = saved_now, saved_today

          midnight = evaluate(0, False)
          assert midnight['today_availability_state'] == 'early_day_pending', midnight
          assert 'sleep_window_pending_day_start' in midnight['pending_today']
          assert 'missing_sleep_window' not in midnight['issues']
          assert midnight['score'] <= 74

          post_night_shift = evaluate(14, True)
          assert post_night_shift['today_availability_state'] == 'post_tn_sleep_pending'
          assert 'missing_sleep_window' not in post_night_shift['issues']
          assert post_night_shift['score'] <= 74

          observed = evaluate(14, True, sleep=True, night_samples=120)
          assert observed['today_availability_state'] == 'evaluated'
          assert not observed['pending_today']

          regular_noon = evaluate(14, False)
          assert 'missing_sleep_window' in regular_noon['issues']
          late_post_shift = evaluate(19, True)
          assert 'missing_sleep_window' in late_post_shift['issues']
          print('OK: five permanent day-start / post-night-shift regression checks')
          PYCODE

      - name: Monitor schedule and fallback provenance tests
        run: python monitor_v231.py

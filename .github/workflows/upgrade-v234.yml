name: Upgrade Garmin Recovery V2.3.4

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-pipeline-main
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar V2.3.4
        run: python upgrade_v234.py

      - name: Validar sintaxis y monitor
        run: |
          python -m py_compile report_delivery_gate.py monitor_v231.py recovery_reliability.py
          python monitor_v231.py

      - name: Publicar V2.3.4 con reintentos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Garmin Recovery Bot"
          git config user.email "actions@github.com"

          git add report_delivery_gate.py monitor_v231.py recovery_reliability.py
          git add .github/workflows/sync.yml .github/workflows/advanced-analytics-rpe.yml

          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
            exit 0
          fi

          git commit -m "Garmin Recovery V2.3.4 robustness"

          for attempt in 1 2 3 4 5; do
            echo "Intento de publicación $attempt/5"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "Conflicto al integrar cambios remotos." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "V2.3.4 publicada correctamente."
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "No se pudo publicar V2.3.4 tras cinco intentos." >&2
          exit 1

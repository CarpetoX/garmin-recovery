name: Garmin Heart Rate Enrichment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Garmin Recovery Sync"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: garmin-pipeline-main
  cancel-in-progress: false

jobs:
  heart-rate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validar sintaxis Garmin
        run: |
          python -m py_compile garmin_metrics.py garmin_activity_metrics.py

      - name: Instalar Garmin Connect
        run: |
          python -m pip install --disable-pip-version-check "garminconnect==0.3.17"

      - name: Actualizar métricas Garmin
        env:
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
        run: |
          python garmin_metrics.py
          python garmin_activity_metrics.py

      - name: Guardar métricas Garmin
        run: |
          git config user.name "Garmin Recovery Bot"
          git config user.email "actions@github.com"

          [ -f garmin_heart_rate.json ] && git add garmin_heart_rate.json || true
          [ -f daily_summary.json ] && git add daily_summary.json || true
          [ -f weekly_summary.json ] && git add weekly_summary.json || true
          [ -f garmin_status.json ] && git add garmin_status.json || true
          [ -f garmin_stress.json ] && git add garmin_stress.json || true
          [ -f garmin_body_battery.json ] && git add garmin_body_battery.json || true
          [ -f garmin_extended.json ] && git add garmin_extended.json || true

          git diff --cached --quiet || git commit -m "Actualizar métricas Garmin"
          git push

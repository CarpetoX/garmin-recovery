name: Garmin Advanced Analytics

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Garmin Heart Rate Enrichment"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: garmin-pipeline-main
  cancel-in-progress: false

jobs:
  advanced-analytics:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validar sintaxis
        run: |
          python -m py_compile advanced_analytics.py rpe_enrichment.py validate_pipeline.py

      - name: Calcular analítica avanzada + RPE
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          DAY_CONTEXT_B64: ${{ secrets.DAY_CONTEXT_B64 }}
          RPE_CSV_URL: ${{ secrets.RPE_CSV_URL }}
        run: |
          python rpe_enrichment.py

      - name: Validar integridad del pipeline
        run: |
          python validate_pipeline.py

      - name: Guardar analítica avanzada
        run: |
          git config user.name "Garmin Recovery Bot"
          git config user.email "actions@github.com"

          git add advanced_analytics.json data_quality.json activity_hr_recovery.json
          git add daily_summary.json weekly_summary.json
          [ -f training_feedback.json ] && git add training_feedback.json || true
          [ -f day_context.json ] && git add day_context.json || true

          git diff --cached --quiet || git commit -m "Actualizar analítica avanzada y RPE"
          git push

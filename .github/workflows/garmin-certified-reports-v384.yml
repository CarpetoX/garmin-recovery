name: Garmin V3.8.4 - Certified Report Artifacts

on:
  workflow_dispatch:
    inputs:
      cycle_id:
        description: 'Optional certified cycle ID (blank = all eligible cycles)'
        required: false
        type: string
  workflow_run:
    workflows: ['Garmin Workflow Monitor and Monthly Report']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: garmin-certified-reports-v384
  cancel-in-progress: false

jobs:
  certified-reports:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate report publisher regression
        run: python -m unittest -v test_cycle_report_batch_v384 test_cycle_report_publisher_v383 test_cycle_real_integration_v382
      - name: Generate verified historical reports (artifact only)
        env:
          CYCLE_ID: ${{ inputs.cycle_id }}
        run: |
          set -euo pipefail
          if [[ -n "${CYCLE_ID:-}" ]]; then
            python cycle_report_batch_v384.py --ledger report_cycles.json --outdir certified_cycle_reports --cycle-id "$CYCLE_ID"
          else
            python cycle_report_batch_v384.py --ledger report_cycles.json --outdir certified_cycle_reports
          fi
      - name: Upload certified report artifact
        uses: actions/upload-artifact@v4
        with:
          name: garmin-certified-reports-v384-${{ github.run_id }}
          path: certified_cycle_reports/
          if-no-files-found: error
          retention-days: 30

      - name: Apply guarded patch and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/garmin-v26-maintenance-patch.py
          python -m compileall -q .
          python -m unittest -v test_morning_sleep_gate test_sleep_integration test_quality_v248 test_training_extensions
          python monitor_v231.py

      - name: Publish one commit only if all tests pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Garmin Recovery Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Preserve the whitespace check: fix legacy trailing spaces in the
          # operating guide before staging (its revised line 3 ends with two).
          python - <<'PYFIX'
          from pathlib import Path
          guide = Path('OPERACION_Y_VALIDACION.md')
          original = guide.read_text(encoding='utf-8')
          normalized = ''.join(line.rstrip(' \t\r\n') + ('\n' if line.endswith('\n') else '')
                               for line in original.splitlines(keepends=True))
          if normalized != original:
              guide.write_text(normalized, encoding='utf-8')
              print('Whitespace normalized: OPERACION_Y_VALIDACION.md')
          PYFIX
          git add README.md .gitignore MAINTENIMIENTO.md OPERACION_Y_VALIDACION.md
          git add rpe_cycle_snapshot.py test_rpe_cycle_snapshot.py test_quality_v248.py
          git add rpe_enrichment.py crossfit_insights.py data_quality.py
          # The built-in token has contents:write but not workflow scope.
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing to publish any workflow modification' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'V2.6: repository maintenance and single-source RPE cycle snapshots'
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo 'Concurrent change conflict - publication stopped safely' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'V2.6 successfully published; run Garmin CI before any Sync'
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

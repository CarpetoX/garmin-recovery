      - name: Atomic publish only after test success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Garmin Recovery Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .gitignore MAINTENIMIENTO.md OPERACION_Y_VALIDACION.md
          git add rpe_cycle_snapshot.py test_rpe_cycle_snapshot.py
          git add rpe_enrichment.py crossfit_insights.py data_quality.py
          git add .github/workflows/crossfit-insights.yml .github/workflows/garmin-ci.yml
          git diff --cached --check
          git commit -m 'V2.6: repository maintenance and single-source RPE cycle snapshots'
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo 'Concurrent change conflict - publication stopped safely' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'V2.6 successfully published; run Garmin CI before any Sync'
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

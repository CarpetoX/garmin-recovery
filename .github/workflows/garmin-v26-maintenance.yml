                                           os.environ.get('PARENT_ADVANCED_RUN_ID'), now)
                  return rows, 'cycle_snapshot', None
              except SnapshotError as exc:
                  return [], 'unavailable', str(exc)


          def normalize_id(x):"""),
                  ("    rows,source,error=sheet_rows()\n", "    rows,source,error=cycle_sheet_rows(feedback,advanced,now)\n"),

name: Instalar calendario de turnos V2.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-pipeline-main
  cancel-in-progress: false

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Comprobar calendario y actualizar analizadores
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from shift_calendar import load_calendar, resolve_day, context_map

          cal = load_calendar()
          assert cal['source_available'] and len(cal['days']) >= 23
          assert resolve_day('2026-10-08')['label'] == 'TN'
          assert resolve_day('2026-10-09')['label'] == 'post-TN'
          assert resolve_day('2026-10-31')['label'] == 'post-TN'
          assert resolve_day('2026-11-01')['label'] == 'MT'
          assert resolve_day('2026-11-28')['label'] == 'post-TN'
          assert resolve_day('2026-12-01')['label'] == 'unknown'

          advanced = Path('advanced_analytics.py')
          source = advanced.read_text(encoding='utf-8')
          old = '''    return {
                  str(k): str(v)
                  for k, v in merged.items()
                  if isinstance(v, str)
              }
          '''
          new = '''    from shift_calendar import context_map as shift_context_map
              return shift_context_map({
                  str(k): str(v) for k, v in merged.items() if isinstance(v, str)
              })
          '''
          if new not in source:
              if source.count(old) != 1:
                  raise RuntimeError('advanced_analytics.py cambió; no se reemplaza a ciegas la lectura de contexto')
              source = source.replace(old, new)

          old_call = '''    context_map = decode_context_map()
          '''
          new_call = '''    from shift_calendar import resolve_day
              context_map = decode_context_map()
          '''
          if new_call not in source:
              if source.count(old_call) != 1:
                  raise RuntimeError('No se localiza la llamada al contexto de advanced_analytics.py')
              source = source.replace(old_call, new_call)

          old_metadata = '''            "privacy_note": (
                          "Exact MT/TN/free labels are read only from optional "
                          "day_context.json or DAY_CONTEXT_B64; no work schedule "
                          "is embedded in this public repository."
                      ),
          '''
          new_metadata = '''            "calendar_source": "shift_calendar.json",
                      "work_shift": resolve_day(TODAY.isoformat())["shift"],
                      "post_tn": resolve_day(TODAY.isoformat())["post_tn"],
                      "calendar_note": (
                          "MT/TN/free via shift_calendar.json; DAY_CONTEXT_B64 "
                          "continua como respaldo para fechas sin calendario."
                      ),
          '''
          if new_metadata not in source:
              if source.count(old_metadata) != 1:
                  raise RuntimeError('No se localiza la nota del calendario; revisar advanced_analytics.py')
              source = source.replace(old_metadata, new_metadata)
          advanced.write_text(source, encoding='utf-8')

          crossfit = Path('crossfit_insights.py')
          code = crossfit.read_text(encoding='utf-8')
          begin = code.find('def shift(day):\n')
          finish = code.find('\ndef main():\n', begin)
          new_shift = '''def shift(day):
              from shift_calendar import resolve_day
              try:
                  return resolve_day(day)['label']
              except (ValueError, TypeError):
                  return 'unknown'
          '''
          if begin < 0 or finish < 0:
              raise RuntimeError('No se ha localizado la función shift de CrossFit')
          original = code[begin:finish]
          if "from shift_calendar import resolve_day" not in original:
              if 'mt={10:' not in original or 'tn={10:' not in original:
                  raise RuntimeError('Cambio inesperado en shift; abortando de forma segura')
              code = code[:begin] + new_shift + code[finish:]
          crossfit.write_text(code, encoding='utf-8')
          PY

      - name: Validar sintaxis e integración
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile shift_calendar.py advanced_analytics.py crossfit_insights.py recovery_reliability.py
          python - <<'PY'
          import advanced_analytics as advanced
          import crossfit_insights as crossfit
          from shift_calendar import resolve_day, context_map
          labels = advanced.decode_context_map()
          assert labels['2026-10-08'] == 'TN'
          assert labels['2026-10-09'] == 'post-TN'
          assert labels['2026-10-31'] == 'post-TN'
          assert labels['2026-11-01'] == 'MT'
          assert crossfit.shift('2026-10-09') == labels['2026-10-09']
          assert crossfit.shift('2026-11-28') == 'post-TN'
          assert crossfit.shift('2026-12-02') == 'unknown'
          assert resolve_day('2026-10-08')['end_day_offset'] == 1
          print('PASSED: integración de calendario en ambos informes')
          PY

      - name: Guardar cambios en repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Garmin Recovery Bot'
          git config user.email 'actions@github.com'
          git add -- advanced_analytics.py crossfit_insights.py
          if git diff --cached --quiet; then
            echo 'Cambios ya instalados.'
            exit 0
          fi
          git commit -m 'Integrar calendario dinámico de turnos en Garmin y CrossFit'
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo 'Conflicto de integracion: no se sobreescriben datos.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'Calendario de turnos instalado correctamente.'
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'No se pudieron publicar los cambios.' >&2
          exit 1

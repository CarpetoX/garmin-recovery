name: Garmin Workflow Monitor and Monthly Report

on:
  workflow_dispatch:
  repository_dispatch:
    types: [garmin-monitor]
  schedule:
    # Watchdogs ~155 min after each nominal Sync slot.
    # They catch a broken chain even when CrossFit never reaches the dispatch step.
    - cron: '5 11 * * *'
      timezone: 'Europe/Madrid'
    - cron: '20 19 * * *'
      timezone: 'Europe/Madrid'
    - cron: '20 1 * * *'
      timezone: 'Europe/Madrid'

permissions:
  contents: write
  actions: read

concurrency:
  group: garmin-monitor-monthly
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Esperar cierre del CrossFit que disparó el monitor
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.client_payload.crossfit_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          run_id = os.environ.get("TRIGGER_RUN_ID", "")

          if not run_id.isdigit():
              raise SystemExit("Missing valid CrossFit run id in repository_dispatch payload")

          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Garmin-Recovery-Monitor-Wait/2.4.1",
          }

          for attempt in range(60):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  run = json.load(response)

              status = run.get("status")
              conclusion = run.get("conclusion")
              print(f"CrossFit run {run_id}: status={status} conclusion={conclusion}")

              if status == "completed":
                  if conclusion != "success":
                      raise SystemExit(
                          f"Triggering CrossFit run completed with {conclusion}"
                      )
                  break

              time.sleep(5)
          else:
              raise SystemExit("Timed out waiting for triggering CrossFit run to complete")
          PY

      - name: Inspect actual workflow runs and generate monthly summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: python monitor_monthly.py

      - name: V2.9.2 - Vincular origen y puntualidad al monitor
        continue-on-error: true
        run: python monitor_origin_integration_v292.py

      # V3.4: distinguir ciclo, informe publicado y entrega real; sin recibos ficticios.
      - name: V3.4 - Auditar trazabilidad y post-sueno sin duplicar certificados
        run: python report_monitor_v34.py

      # V3.7.3: consulta independiente Actions, sin bloqueo ni recibos ficticios.
      - name: V3.7.3 - Observar certificado de ciclo y enlace CrossFit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cycle_observer_v373.py

      # V2.9.7: capa aditiva, sin alterar el estado historico ni bloquear el espejo.
      - name: V2.9.7 - Separar el ciclo actual de las alertas historicas
        continue-on-error: true
        run: python monitor_clarity_v297.py

      - name: V2.9.4 - Calcular fiabilidad historica de 7 y 28 dias
        run: python reliability_history_v294.py --ledger report_cycles.json --out reliability_history_v294.json

      - name: Commit diagnostics and report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflow_health.json monthly_report.json
          [ ! -f origin_monitor_v292.json ] || git add origin_monitor_v292.json
          [ ! -f reliability_history_v294.json ] || git add reliability_history_v294.json
          [ ! -f cycle_observation_v373.json ] || git add cycle_observation_v373.json
          if git diff --cached --quiet; then
            echo 'No diagnostic changes to publish.'
            exit 0
          fi
          git commit -m 'Update workflow health and monthly report'
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin "${{ github.event.repository.default_branch }}"; then
              git rebase --abort || true
              echo 'Conflict while rebasing monitor reports; refusing to overwrite remote data.' >&2
              exit 1
            fi
            if git push origin HEAD:"${{ github.event.repository.default_branch }}"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'Failed to publish monitor reports after five attempts.' >&2
          exit 1

      # V2.9.6 AUTO: al terminar el monitor, comparar el historico validado
      # con el espejo persistente. No crea tareas ni toca report_cycles.json.
      - name: V2.9.6 - Solicitar espejo automatico si hay certificados nuevos
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python shadow_autodispatch_v296.py --source report_cycles.json
  certified-reports-after-monitor:
    name: V3.8.8 - Certified reports after successful monitor
    needs: monitor
    if: ${{ needs.monitor.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate certified report regression
        run: python -m unittest -v test_cycle_report_v386 test_cycle_report_v385 test_cycle_report_batch_v384 test_cycle_report_publisher_v383 test_cycle_real_integration_v382
      - name: Generate certified reports (artifact only)
        run: python cycle_report_batch_v386.py --ledger report_cycles.json --outdir certified_cycle_reports_v386
      - name: Upload reports and quarantine manifest
        uses: actions/upload-artifact@v4
        with:
          name: garmin-certified-reports-v388-${{ github.run_id }}
          path: certified_cycle_reports_v386/
          if-no-files-found: error
          retention-days: 30

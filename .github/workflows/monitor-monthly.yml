name: Garmin Workflow Monitor and Monthly Report

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Garmin CrossFit Insights
    types: [completed]
  schedule:
    # Watchdogs ~155 min after each nominal Sync slot.
    # They catch a broken chain even when CrossFit never starts.
    - cron: '5 11 * * *'
      timezone: 'Europe/Madrid'
    - cron: '20 19 * * *'
      timezone: 'Europe/Madrid'
    - cron: '20 1 * * *'
      timezone: 'Europe/Madrid'

permissions:
  contents: write
  actions: read

concurrency:
  group: garmin-monitor-monthly
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect actual workflow runs and generate monthly summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: python monitor_monthly.py
      - name: Commit diagnostics and report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflow_health.json monthly_report.json
          if git diff --cached --quiet; then
            echo 'No diagnostic changes to publish.'
            exit 0
          fi
          git commit -m 'Update workflow health and monthly report'
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin "${{ github.event.repository.default_branch }}"; then
              git rebase --abort || true
              echo 'Conflict while rebasing monitor reports; refusing to overwrite remote data.' >&2
              exit 1
            fi
            if git push origin HEAD:"${{ github.event.repository.default_branch }}"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'Failed to publish monitor reports after five attempts.' >&2
          exit 1

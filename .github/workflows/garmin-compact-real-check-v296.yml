name: Garmin V2.9.6 - Indice compacto REAL (temporal)

# Diagnostico MANUAL y SOLO LECTURA. No crea commits ni sincroniza Garmin.
# Esta fase NO sustituye report_cycles.json por el indice compacto.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garmin-v296-compact-real-check
  cancel-in-progress: false

jobs:
  compact-real-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Leer el commit de main sin credenciales persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar 36 pruebas del archivado e indice compacto
        run: python -m unittest -q test_cycle_shards_v296 test_ledger_compact_preview_v296

      - name: Guardar huella de entrada y auditar certificados
        shell: bash
        run: |
          set -euo pipefail
          sha256sum report_cycles.json > "$RUNNER_TEMP/garmin-v296-source.sha256"
          python cycle_shards_v296.py --audit --ledger report_cycles.json

      - name: Fragmentar historico SOLO en memoria temporal del runner
        shell: bash
        run: |
          set -euo pipefail
          python cycle_shards_v296.py --prepare \
            --ledger report_cycles.json \
            --archive-dir "$RUNNER_TEMP/garmin-v296-shards" \
            --max-shard-bytes 524288
          python cycle_shards_v296.py --verify \
            --ledger report_cycles.json \
            --archive-dir "$RUNNER_TEMP/garmin-v296-shards"

      - name: Construir y verificar indice compacto REAL
        shell: bash
        run: |
          set -euo pipefail
          python ledger_compact_preview_v296.py \
            --ledger report_cycles.json \
            --archive-dir "$RUNNER_TEMP/garmin-v296-shards" \
            --prepare "$RUNNER_TEMP/garmin-v296-compact-preview.json"
          python ledger_compact_preview_v296.py \
            --ledger report_cycles.json \
            --archive-dir "$RUNNER_TEMP/garmin-v296-shards" \
            --verify "$RUNNER_TEMP/garmin-v296-compact-preview.json"

      - name: Reconstruir completo y certificar integridad sin publicar datos Garmin
        shell: bash
        run: |
          set -euo pipefail
          python cycle_shards_v296.py --restore \
            --ledger report_cycles.json \
            --archive-dir "$RUNNER_TEMP/garmin-v296-shards" \
            --out "$RUNNER_TEMP/garmin-v296-restored.json"
          sha256sum --check "$RUNNER_TEMP/garmin-v296-source.sha256"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from ledger_compact_preview_v296 import verify
          from cycle_shards_v296 import verify_archive

          source = Path('report_cycles.json')
          root = Path(os.environ['RUNNER_TEMP'])
          shard_dir = root / 'garmin-v296-shards'
          preview_path = root / 'garmin-v296-compact-preview.json'
          restored_path = root / 'garmin-v296-restored.json'
          source_bytes = source.read_bytes()
          original = json.loads(source_bytes)
          restored = json.loads(restored_path.read_bytes())
          preview = json.loads(preview_path.read_bytes())
          result = verify(source, shard_dir, preview)
          restored_again, audit = verify_archive(shard_dir, source)
          if original != restored or original != restored_again:
              raise SystemExit('ERROR: la reconstruccion NO coincide con el historico original')
          if result['cycle_count'] != original['count'] or result['complete_reconstruction'] is not True:
              raise SystemExit('ERROR: recuento o integridad del indice compacto incorrectos')
          if not 0 < result['preview_bytes'] < result['source_bytes']:
              raise SystemExit('ERROR: indice compacto no reduce el tamano real')
          source_hash = hashlib.sha256(source_bytes).hexdigest()
          index_bytes = (shard_dir / 'index.json').stat().st_size
          snapshot_count = sum(isinstance(c.get('snapshot'), dict) for c in original['cycles'])
          legacy_count = sum(c.get('legacy_without_snapshot') is True for c in original['cycles'])

          proof = {
              'version': '2.9.6',
              'status': 'real_compact_preview_verified',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'commit_sha': os.environ.get('GITHUB_SHA'),
              'certificates': result['cycle_count'],
              'snapshot_sha256_verified': snapshot_count,
              'legacy_records_preserved': legacy_count,
              'fragments': result['shard_count'],
              'original_ledger_bytes': result['source_bytes'],
              'compact_preview_bytes': result['preview_bytes'],
              'shard_manifest_bytes': index_bytes,
              'compact_reduction_pct': result['preview_reduction_pct'],
              'reconstructed_all_cycles': True,
              'original_sha256_unchanged': source_hash,
              'source_matches_unchanged_shards': audit['source_consistent'],
              'production_cutover': False,
              'source_modified': False,
              'payloads_in_artifact': False,
          }
          path = root / 'garmin-v296-compact-real-proof.json'
          path.write_text(json.dumps(proof, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(proof, ensure_ascii=False, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Garmin V2.9.6 - Indice compacto REAL comprobado\n\n')
              summary.write('| Dato | Resultado |\n|---|---|\n')
              for k, v in proof.items():
                  summary.write(f'| `{k}` | `{v}` |\n')
              summary.write('\n**Lectura exclusivamente. Sin cambios en Garmin Sync, Apps Script o report_cycles.json.**\n')
          PY

      - name: Publicar SOLAMENTE justificante compacto (sin datos de salud)
        uses: actions/upload-artifact@v4
        with:
          name: garmin-v296-compact-real-proof
          path: ${{ runner.temp }}/garmin-v296-compact-real-proof.json
          retention-days: 7
          if-no-files-found: error

name: Garmin Recovery - Reparar validacion de medianoche V2.4.9

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-pipeline-main
  cancel-in-progress: false

jobs:
  fix-midnight:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Corregir validacion de dias parciales sin alterar puntuaciones
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pipeline_regression_tests.py')
          original = path.read_text(encoding='utf-8')
          # Use the exact unindented source block from V2.4.8, not the YAML layout.
          before = ('    today = quality.get("today", {}) if isinstance(quality, dict) else {}\n'
                    '    if isinstance(today, dict) and today.get("heart_rate_partial_day") is not True:\n'
                    '        fail(errors, "partial_day_quality_flag_lost", latest_day)\n')
          after = ('    # Quality.today refers to the date of its own generation, not necessarily\n'
                   '    # to the last Garmin HR day (which may still be yesterday at 00:00).\n'
                   '    today = quality.get("today", {}) if isinstance(quality, dict) else {}\n'
                   '    quality_date = str(quality.get("generated_at") or "")[:10] if isinstance(quality, dict) else ""\n'
                   '    if len(quality_date) != 10 or not quality_date[4:5] == "-" or not quality_date[7:8] == "-":\n'
                   '        fail(errors, "partial_day_quality_date_missing")\n'
                   '    elif quality_date == latest_day:\n'
                   '        if not isinstance(today, dict) or today.get("heart_rate_partial_day") is not True:\n'
                   '            fail(errors, "partial_day_quality_flag_lost", latest_day)\n'
                   '    elif quality_date > latest_day:\n'
                   '        warn(warnings, "partial_day_hr_source_behind_quality_date",\n'
                   '             f"{latest_day}_vs_{quality_date}")\n'
                   '    else:\n'
                   '        fail(errors, "partial_day_quality_outdated",\n'
                   '             f"{quality_date}_vs_{latest_day}")\n')

          if after in original:
              print('Correccion aplicada anteriormente; no hay que repetirla.')
          elif original.count(before) == 1:
              path.write_text(original.replace(before, after, 1), encoding='utf-8')
              print('Corregida la comparacion de dia parcial segun fecha.')
          else:
              raise SystemExit('La version de pipeline_regression_tests.py difiere de la comprobada. No se toca.')
          PY

      - name: Comprobar sintaxis y tests del cambio de fecha
        shell: bash
        run: |
          python -m py_compile pipeline_regression_tests.py
          python - <<'PY'
          from pipeline_regression_tests import test_partial_day

          heart = {'days': {'2026-10-10': {'partial_day': True}}}
          advanced = {'robust_trends': {
              window: {'metrics': {'daytime_hr': {'partial_days_excluded': 1}}}
              for window in ('3d', '7d', '28d')
          }}
          def check(quality, expect_error=False, expect_warning=False):
              errors, warnings = [], []
              test_partial_day(heart, advanced, quality, errors, warnings)
              assert bool(errors) == expect_error, (errors, warnings)
              assert bool(warnings) == expect_warning, (errors, warnings)
              return errors, warnings

          # Same-day flag is compulsory.
          check({'generated_at': '2026-10-10T23:59:00+02:00',
                 'today': {'heart_rate_partial_day': True}})
          e, w = check({'generated_at': '2026-10-10T23:59:00+02:00',
                        'today': {'heart_rate_partial_day': False}}, expect_error=True)
          assert e == ['partial_day_quality_flag_lost:2026-10-10']

          # Exactly the incident at midnight: previous HR day still partial.
          e, w = check({'generated_at': '2026-10-11T00:00:40+02:00',
                        'today': {'heart_rate_partial_day': False}}, expect_warning=True)
          assert w[0].startswith('partial_day_hr_source_behind_quality_date:')

          # Do not silence genuinely stale data-quality reports.
          e, w = check({'generated_at': '2026-10-09T23:00:00+02:00',
                        'today': {'heart_rate_partial_day': False}}, expect_error=True)
          assert e[0].startswith('partial_day_quality_outdated:')
          check({'generated_at': '', 'today': {}}, expect_error=True)
          print('OK: mismas fechas, cruce de medianoche, desfase y sello de fecha ausente.')
          PY

      - name: Ejecutar todas las pruebas con datos del repositorio
        run: |
          python -m unittest -v test_morning_sleep_gate test_sleep_integration test_quality_v248
          python pipeline_regression_tests.py --stage advanced
          python monitor_v231.py

      - name: Publicar correccion si todas las pruebas pasan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline_regression_tests.py
          if git diff --cached --quiet; then
            echo 'Correccion ya presente: no es necesario publicar.'
            exit 0
          fi
          git commit -m 'Fix midnight partial-day HR quality date mismatch'
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo 'Conflicto con cambios nuevos; no se sobrescriben.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'Correccion de medianoche publicada.'
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'No se pudo publicar despues de cinco intentos.' >&2
          exit 1

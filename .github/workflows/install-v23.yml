name: Instalar Garmin Recovery V2.3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-pipeline-main
  cancel-in-progress: false

jobs:
  install-v23:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Aplicar V2.3 sin editar otros workflows
        run: |
          python recovery_v23.py --install
          # GitHub Actions no puede publicar cambios en workflows con este token.
          # Conservamos el parche de recovery_reliability.py y restauramos
          # los cambios locales no publicados del workflow de analítica.
          git restore -- .github/workflows/advanced-analytics-rpe.yml
          git diff --exit-code -- .github/workflows/advanced-analytics-rpe.yml

      - name: Comprobar sintaxis y escenarios críticos
        run: |
          python -m py_compile recovery_v23.py recovery_reliability.py advanced_analytics.py validate_pipeline.py
          python recovery_v23.py --self-test

      - name: Comprobar integración completa sin modificar datos publicados
        run: |
          python - <<'PY'
          from recovery_reliability import produce, validate_report_consistency
          results = produce()
          assessment = results['recovery_assessment.json']
          assert assessment['methodology_version'] == 'recovery-reliability-v2.3'
          assert 'sleep_integrity' in assessment['v23']
          assert assessment['v23']['sleep_integrity']['minutes_added_to_sleep'] == 0
          issues = validate_report_consistency(
              assessment, results['advanced_analytics.json'],
              results['daily_summary.json'], results['weekly_summary.json'],
              results['data_quality.json'])
          assert not issues, f'Validation failed: {issues}'
          print('V2.3 integration validated; historical Garmin data unchanged.')
          PY

      - name: Guardar instalación sin reescribir los informes históricos
        run: |
          git config user.name "Garmin Recovery Bot"
          git config user.email "actions@github.com"
          git add recovery_reliability.py
          if ! git diff --cached --quiet; then
            git commit -m "Instalar recuperación V2.3: sueño post-TN y procedencia de puntuaciones"
            git push origin HEAD:main
          else
            echo "V2.3 ya instalada (ejecución idempotente)."
          fi

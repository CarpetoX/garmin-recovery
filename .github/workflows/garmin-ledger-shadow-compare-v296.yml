name: Garmin V2.9.6 - Shadow Compare REAL (temporal)

# Prueba MANUAL, AISLADA y de SOLO LECTURA.
# No cambia la fuente report_cycles.json, no hace commits ni llama Garmin.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garmin-v296-shadow-real-check
  cancel-in-progress: false

jobs:
  shadow-real-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el commit con permisos de solo lectura
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar las 71 pruebas del nuevo almacenamiento
        run: python -m unittest -q test_cycle_shards_v296 test_ledger_compact_preview_v296 test_ledger_reader_v296 test_ledger_access_v296

      - name: Auditar el original y registrar la huella previa
        shell: bash
        run: |
          set -euo pipefail
          sha256sum report_cycles.json > "$RUNNER_TEMP/garmin-v296-source.sha256"
          python cycle_shards_v296.py --audit --ledger report_cycles.json

      - name: Construir copias solo en el disco temporal del runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/garmin-v296-shadow"
          python cycle_shards_v296.py --prepare \
            --ledger report_cycles.json \
            --archive-dir "$RUNNER_TEMP/garmin-v296-shadow/shards" \
            --max-shard-bytes 524288
          python ledger_compact_preview_v296.py \
            --ledger report_cycles.json \
            --archive-dir "$RUNNER_TEMP/garmin-v296-shadow/shards" \
            --prepare "$RUNNER_TEMP/garmin-v296-shadow/compact-preview.json"

      - name: Comparar tres modos de lectura y rechazar corrupcion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          from cycle_shards_v296 import ShardError, canonical_hash
          from ledger_access_v296 import read_compatible

          root = Path(os.environ['RUNNER_TEMP']) / 'garmin-v296-shadow'
          src = Path('report_cycles.json')
          raw_before = src.read_bytes()
          preview = root / 'compact-preview.json'
          shards = root / 'shards'

          original, legacy = read_compatible(src, mode='legacy_only')
          parallel, shadow = read_compatible(src, mode='shadow_compare',
                                             preview_path=preview, archive_dir=shards)
          missing_original = root / 'no-such-report-cycles.json'
          if missing_original.exists():
              raise SystemExit('La prueba independiente tiene acceso inesperado al original')
          independent, shard_report = read_compatible(missing_original,
                                  mode='shards_only', preview_path=preview,
                                  archive_dir=shards)
          if original != parallel or original != independent:
              raise SystemExit('ERROR: los tres lectores devuelven datos distintos')
          if len({canonical_hash(x) for x in (original, parallel, independent)}) != 1:
              raise SystemExit('ERROR: SHA-256 del contenido reconstruido distinto')
          if shadow['status'] != 'shadow_cross_checked' or not shadow['source_original_verified']:
              raise SystemExit('ERROR: shadow compare no valido')
          if not (legacy['read_only'] and shadow['read_only'] and shard_report['read_only']):
              raise SystemExit('ERROR: alguno de los modos permite escritura')

          preview_obj = json.loads(preview.read_bytes())
          if preview_obj['cycles']:
              preview_obj['cycles'][0]['cycle_id'] = 'TAMPERED-DO-NOT-ACCEPT'
              corrupted_preview = root / 'corrupted-preview.json'
              corrupted_preview.write_text(json.dumps(preview_obj), encoding='utf-8')
              try:
                  read_compatible(src, mode='shadow_compare',
                                  preview_path=corrupted_preview, archive_dir=shards)
              except ShardError:
                  pass
              else:
                  raise SystemExit('ERROR: el shadow ha aceptado un indice alterado')

          corrupted_dir = root / 'corrupt-shards'
          shutil.copytree(shards, corrupted_dir)
          index = json.loads((corrupted_dir / 'index.json').read_bytes())
          if index['shards']:
              victim = corrupted_dir / index['shards'][0]['path']
              victim.write_bytes(victim.read_bytes() + b'CORRUPTED')
              try:
                  read_compatible(missing_original, mode='shards_only',
                                  preview_path=preview, archive_dir=corrupted_dir)
              except ShardError:
                  pass
              else:
                  raise SystemExit('ERROR: se acepto un fragmento alterado')

          if src.read_bytes() != raw_before:
              raise SystemExit('ERROR: el historico de produccion ha cambiado')
          manifest = json.loads((shards / 'index.json').read_bytes())
          proof = {
              'version': '2.9.6',
              'status': 'real_shadow_compare_verified',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'source_commit': os.environ.get('GITHUB_SHA'),
              'legacy_certificates': len(original['cycles']),
              'shadow_certificates': len(parallel['cycles']),
              'shards_only_certificates': len(independent['cycles']),
              'snapshot_checksums_validated': sum(isinstance(x.get('snapshot'),dict)
                                                  for x in original['cycles']),
              'legacy_records_preserved': sum(x.get('legacy_without_snapshot') is True
                                               for x in original['cycles']),
              'fragment_count': len(manifest['shards']),
              'original_ledger_bytes': len(raw_before),
              'compact_index_bytes': preview.stat().st_size,
              'index_reduction_pct': round(100 * (1 - preview.stat().st_size / len(raw_before)), 1),
              'three_modes_equal': True,
              'independent_mode_no_original': True,
              'rejects_tampered_index': bool(preview_obj['cycles']),
              'rejects_tampered_fragment': bool(index['shards']),
              'original_sha256': hashlib.sha256(raw_before).hexdigest(),
              'read_only': True,
              'production_cutover': False,
              'source_modified': False,
              'physiological_data_published': False,
          }
          output = root / 'garmin-v296-shadow-real-proof.json'
          output.write_text(json.dumps(proof, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(proof, ensure_ascii=False, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Garmin Recovery V2.9.6 - Shadow compare real\n\n')
              f.write('| Prueba | Resultado |\n|---|---|\n')
              for key, value in proof.items():
                  f.write(f'| `{key}` | `{value}` |\n')
              f.write('\nNo se reemplaza report_cycles.json ni se modifica produccion.\n')
          PY

      - name: Verificar que el original no se modifico ni un byte
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/garmin-v296-source.sha256"
          git diff --exit-code -- report_cycles.json

      - name: Publicar solo justificante tecnico
        uses: actions/upload-artifact@v4
        with:
          name: garmin-v296-shadow-real-proof
          path: ${{ runner.temp }}/garmin-v296-shadow/garmin-v296-shadow-real-proof.json
          retention-days: 7
          if-no-files-found: error

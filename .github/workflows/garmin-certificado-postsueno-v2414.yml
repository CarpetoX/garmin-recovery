name: Garmin Recovery - Instalar certificados post-sueno V2.4.14

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: garmin-pipeline-main
  cancel-in-progress: false

jobs:
  install-certificates:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener main sin sobrescribir datos
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Modificar SOLO report_delivery_gate.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          file = Path('report_delivery_gate.py')
          source = file.read_text(encoding='utf-8')
          original = source

          def replace_one(before, after):
              global source
              count = source.count(before)
              if count != 1:
                  raise RuntimeError(f'Anchor mismatch expected 1 found {count}: {before[:100]!r}. No changes.')
              source = source.replace(before, after, 1)

          replace_one("    return None\n\n\ndef successful(run, allowed_events):", '''    return None


          def late_post_sleep_slot(sync_started):
              """Map a late verified post-sleep sync to the prior pending morning cycle.

              This is only candidate routing; _publish_post_sleep checks all evidence.
              """
              if sync_started is None:
                  return None
              local = sync_started.astimezone(TZ)
              day = local.date().isoformat()
              if not (datetime(local.year, local.month, local.day, 8, 30, tzinfo=TZ)
                      <= local < datetime(local.year, local.month, local.day, 22, 45, tzinfo=TZ)):
                  return None
              ledger = _read_json('report_cycles.json', {})
              cycles = ledger.get('cycles', []) if isinstance(ledger, dict) else []
              base = next((row for row in cycles if isinstance(row, dict)
                           and row.get('cycle_id') == day + '-0830'), None)
              if not base or (base.get('snapshot') or {}).get('morning_sleep', {}).get('evidence_valid') is not False:
                  return None
              sleep = _read_json('morning_sleep_status.json', {})
              if sleep.get('date') != day or sleep.get('state') != 'confirmed_ready':
                  return None
              end = stamp(sleep.get('sleep_end_local'))
              margin = stamp(sleep.get('earliest_definitive_at'))
              generated = stamp(sleep.get('generated_at'))
              if (not end or not margin or not generated or
                      margin > local or generated < local - timedelta(minutes=5)):
                  return None
              slot_time = stamp(base.get('slot_at'))
              if slot_time is None:
                  return None
              return {'cycle_id': day + '-0830', 'slot_at': slot_time,
                      'report_target': '09:05', 'slot': '0830'}


          def successful(run, allowed_events):''')

          replace_one("    slot = slot_for_run(stamp(sync['created_at']))\n    if not slot:\n        return None, ['sync_outside_report_slot']", "    slot = slot_for_run(stamp(sync['created_at']))\n    if not slot:\n        slot = late_post_sleep_slot(stamp(sync['created_at']))\n    if not slot:\n        return None, ['sync_outside_report_slot']")

          replace_one("            'weekly_report': crossfit.get('weekly_report'),\n            'activities_today': crossfit_day,", "            'weekly_report': crossfit.get('weekly_report'),\n            'performance_report': (crossfit.get('training_extensions') or {}).get('performance_report'),\n            'activities_today': crossfit_day,")

          replace_one("        'entry_schema_version': 2,\n        'cycle_id': cycle_id, 'ready_at': cert['verified_at'],", "        'entry_schema_version': 2,\n        'certificate_kind': cert.get('certificate_kind', 'scheduled_cycle'),\n        'parent_cycle_id': cert.get('parent_cycle_id'),\n        'cycle_id': cycle_id, 'ready_at': cert['verified_at'],")

          replace_one("\ndef main():\n    repo = os.environ.get('GITHUB_REPOSITORY', '')", '''
          def _publish_post_sleep(chain, generated, now, output):
              """Append one supplemental certificate; keep original 08:30 immutable.

              A data-ready certificate is not proof of a ChatGPT delivery.
              """
              sync_start = stamp(chain['runs']['sync']['created_at'])
              if sync_start is None:
                  return False
              local = sync_start.astimezone(TZ)
              day = local.date().isoformat()
              original_id, supplement_id = day + '-0830', day + '-0830-post-sleep'
              ledger = _read_json('report_cycles.json', {})
              cycles = ledger.get('cycles', []) if isinstance(ledger, dict) else []
              if not isinstance(cycles, list):
                  return False
              original = next((row for row in cycles if isinstance(row, dict)
                               and row.get('cycle_id') == original_id), None)
              if not original or any(isinstance(row, dict) and row.get('cycle_id') == supplement_id for row in cycles):
                  return False
              initial_sleep = (original.get('snapshot') or {}).get('morning_sleep') or {}
              if initial_sleep.get('evidence_valid') is not False:
                  return False
              original_sync = stamp((original.get('chain') or {}).get('sync', {}).get('started_at'))
              if not original_sync or sync_start <= original_sync:
                  return False

              sleep = _read_json('morning_sleep_status.json', {})
              if (sleep.get('date') != day or sleep.get('state') != 'confirmed_ready'
                      or sleep.get('is_definitive') is not True
                      or sleep.get('wake_confirmed') is not True
                      or sleep.get('episode_end_confirmed') is not True
                      or sleep.get('recovery_matches_sleep_episode') is not True
                      or sleep.get('recovery_sleep_fresh') is not True):
                  return False
              end = stamp(sleep.get('sleep_end_local'))
              margin = stamp(sleep.get('earliest_definitive_at'))
              checked = stamp(sleep.get('generated_at'))
              if (not end or not margin or not checked or end.date().isoformat() != day
                      or abs((margin - end).total_seconds() - 1800) > 120
                      or sync_start < margin or margin > now
                      or checked < sync_start - timedelta(minutes=5)
                      or checked > now + timedelta(minutes=2)):
                  return False

              rec = _read_json('recovery_assessment.json', {})
              recent = rec.get('current') or {}
              freshness = rec.get('input_freshness') or {}
              measured_end = stamp(recent.get('sleep_end_local'))
              if (rec.get('state') != 'assessed'
                      or recent.get('date') != day or not measured_end
                      or abs((measured_end - end).total_seconds()) > 300
                      or not all(freshness.get(k) is True for k in ('hrv', 'sleep', 'heart_rate'))
                      or not isinstance(recent.get('hrv_ms'), (int, float))
                      or recent['hrv_ms'] <= 0):
                  return False

              confirmed = (_read_json('garmin_sleep_history.json', {}).get('days') or {}).get(day) or {}
              confirmed_end = stamp(confirmed.get('sleep_end_local'))
              hrv = (_read_json('garmin_hrv_timeline.json', {}).get('days') or {}).get(day) or {}
              hrv_end = stamp(hrv.get('sleep_end_local'))
              if (confirmed.get('window_confirmed') is not True
                      or not confirmed_end or abs((confirmed_end - end).total_seconds()) > 300
                      or not hrv_end or abs((hrv_end - end).total_seconds()) > 300
                      or not isinstance(hrv.get('night_avg_ms'), (int, float))
                      or hrv['night_avg_ms'] <= 0):
                  return False

              certificate = build_certificate(chain, generated, now)
              certified_sleep = certificate.get('morning_sleep') or {}
              if certified_sleep.get('evidence_valid') is not True:
                  return False
              certificate.update(
                  cycle_id=supplement_id,
                  parent_cycle_id=original_id,
                  certificate_kind='post_sleep_supplement',
                  physiological_report_status='definitive',
                  target_report_at='after_confirmed_sleep',
              )
              if not append_ready_cycle(certificate):
                  return False
              # The new certificate may be the latest pointer only when no different
              # afternoon/evening certificate would be overwritten.
              prior = _read_json('report_ready.json', {})
              if prior.get('cycle_id') in (original_id, supplement_id):
                  output.write_text(json.dumps(certificate, ensure_ascii=False, indent=2)
                                    + '\\n', encoding='utf-8')
              print('Post-sleep certificate READY:', supplement_id,
                    'sync_run', chain['runs']['sync']['id'],
                    'delivery remains UNVERIFIED')
              return True


          def main():
              repo = os.environ.get('GITHUB_REPOSITORY', '')''')

          replace_one("    output = Path('report_ready.json')\n    if output.is_file():", "    output = Path('report_ready.json')\n    _publish_post_sleep(chain, generated, datetime.now(TZ), output)\n    stored_cycles = _read_json('report_cycles.json', {}).get('cycles', [])\n    if any(isinstance(row, dict) and row.get('cycle_id') == chain['slot']['cycle_id']\n           for row in stored_cycles):\n        print('Report gate: original cycle is immutable in ledger; leave current pointer unchanged.')\n        return 0\n    if output.is_file():")

          assert len(source) > len(original) + 5500
          compile(source, str(file), 'exec')
          file.write_text(source, encoding='utf-8')
          print('OK v2.4.14: report_delivery_gate.py patched, existing gates preserved')
          PY
      - name: Pruebas post-sueno V2.4.14 (9 escenarios)
        shell: bash
        run: |
          cat > /tmp/verify_cert_v2414.py <<'PY'
          import copy
          import tempfile
          import os, sys
          sys.path.insert(0, os.getcwd())
          import unittest
          from datetime import datetime, timedelta
          from pathlib import Path
          from unittest.mock import patch
          from zoneinfo import ZoneInfo

          import report_sleep_integration  # preserves gate's real build/snapshot integration
          import report_delivery_gate as gate

          TZ = ZoneInfo('Europe/Madrid')
          DAY = '2026-10-11'
          END = '2026-10-11T09:10:13+02:00'


          class CertificateTests(unittest.TestCase):
              def setUp(self):
                  self.now = datetime(2026, 10, 11, 9, 46, tzinfo=TZ)
                  self.sync = datetime(2026, 10, 11, 9, 44, tzinfo=TZ)
                  self.chain = {'slot': {'cycle_id': DAY+'-0830', 'slot':'0830'},
                                'runs': {'sync': {'id': 789, 'created_at': self.sync.isoformat()}}}
                  self.base = {'cycle_id':DAY+'-0830', 'slot_at':DAY+'T08:30:00+02:00',
                               'chain': {'sync': {'started_at': DAY+'T08:40:00+02:00'}},
                               'snapshot': {'morning_sleep': {'evidence_valid': False}}}
                  self.sources = {
                    'report_cycles.json': {'cycles':[self.base]},
                    'report_ready.json': {'cycle_id':DAY+'-0830','status':'ready'},
                    'morning_sleep_status.json': {
                      'date':DAY, 'state':'confirmed_ready','is_definitive':True,
                      'wake_confirmed':True,'episode_end_confirmed':True,
                      'recovery_matches_sleep_episode':True,'recovery_sleep_fresh':True,
                      'sleep_end_local':END,
                      'earliest_definitive_at':DAY+'T09:40:13+02:00',
                      'generated_at':DAY+'T09:45:00+02:00'},
                    'recovery_assessment.json': {
                      'state':'assessed','current':{'date':DAY,'sleep_end_local':END,'hrv_ms':39},
                      'input_freshness':{'hrv':True,'sleep':True,'heart_rate':True}},
                    'garmin_sleep_history.json': {'days':{DAY:{'window_confirmed':True,'sleep_end_local':END}}},
                    'garmin_hrv_timeline.json': {'days':{DAY:{'sleep_end_local':END,'night_avg_ms':39}}}
                  }
                  self.cert = {'cycle_id': DAY+'-0830', 'morning_sleep': {'evidence_valid':True},
                               'source_generated_at':{}, 'chain':{}, 'limitations':[],
                               'status':'ready','delivery_status':'unconfirmed_no_chatgpt_receipt'}

              def execute(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      output=Path(tmp)/'report_ready.json'
                      output.write_text('DO_NOT_OVERWRITE')
                      with patch.object(gate,'_read_json',side_effect=lambda name,default: self.sources.get(name,default)), \
                           patch.object(gate,'build_certificate',return_value=copy.deepcopy(self.cert)), \
                           patch.object(gate,'append_ready_cycle',return_value=True) as add:
                          result=gate._publish_post_sleep(self.chain,{},self.now,output)
                      return result,add.call_args,output.read_text()

              def test_supplement_created_once_without_editing_original(self):
                  result,called,content=self.execute()
                  self.assertTrue(result)
                  cert=called.args[0]
                  self.assertEqual(cert['cycle_id'],DAY+'-0830-post-sleep')
                  self.assertEqual(cert['parent_cycle_id'],DAY+'-0830')
                  self.assertEqual(cert['certificate_kind'],'post_sleep_supplement')
                  self.assertEqual(cert['physiological_report_status'],'definitive')
                  self.assertEqual(cert['delivery_status'],'unconfirmed_no_chatgpt_receipt')
                  self.assertIn(DAY+'-0830-post-sleep',content)
                  self.assertEqual(self.sources['report_cycles.json']['cycles'][0],self.base)

              def test_duplicate_is_rejected(self):
                  self.sources['report_cycles.json']['cycles'].append({'cycle_id':DAY+'-0830-post-sleep'})
                  result,called,_=self.execute()
                  self.assertFalse(result); self.assertIsNone(called)

              def test_unconfirmed_sleep_is_rejected(self):
                  self.sources['morning_sleep_status.json']['is_definitive']=False
                  result,called,_=self.execute()
                  self.assertFalse(result); self.assertIsNone(called)

              def test_sync_before_30_minutes_is_rejected(self):
                  self.chain['runs']['sync']['created_at']=DAY+'T09:25:00+02:00'
                  result,called,_=self.execute()
                  self.assertFalse(result); self.assertIsNone(called)

              def test_no_unverified_hrv(self):
                  self.sources['garmin_hrv_timeline.json']['days'][DAY]['night_avg_ms']=None
                  result,called,_=self.execute()
                  self.assertFalse(result); self.assertIsNone(called)

              def test_earlier_definitive_certificate_blocks_supplement(self):
                  self.base['snapshot']['morning_sleep']['evidence_valid']=True
                  result,called,_=self.execute()
                  self.assertFalse(result); self.assertIsNone(called)

              def test_never_replace_evening_pointer(self):
                  self.sources['report_ready.json']['cycle_id']=DAY+'-1645'
                  result,called,content=self.execute()
                  self.assertTrue(result);self.assertIsNotNone(called)
                  self.assertEqual(content,'DO_NOT_OVERWRITE')

              def test_late_sync_after_normal_window_can_match_only_pending(self):
                  self.sources['morning_sleep_status.json']['generated_at']=DAY+'T13:00:00+02:00'
                  at=datetime(2026,10,11,13,0,tzinfo=TZ)
                  with patch.object(gate,'_read_json',side_effect=lambda name,default:self.sources.get(name,default)):
                      candidate=gate.late_post_sleep_slot(at)
                  self.assertEqual(candidate['cycle_id'],DAY+'-0830')
                  self.assertEqual(candidate['slot'],'0830')

              def test_stale_sleep_status_blocks_late_routing(self):
                  at=datetime(2026,10,11,13,0,tzinfo=TZ)
                  with patch.object(gate,'_read_json',side_effect=lambda name,default:self.sources.get(name,default)):
                      candidate=gate.late_post_sleep_slot(at)
                  self.assertIsNone(candidate)

          if __name__ == '__main__':
              unittest.main(verbosity=2)
          PY
          python /tmp/verify_cert_v2414.py
          python -m unittest -v test_sleep_integration test_morning_sleep_gate test_quality_v248 test_training_extensions
          python -m py_compile report_delivery_gate.py report_sleep_integration.py
      - name: Publicar exclusivamente report_delivery_gate.py
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- report_delivery_gate.py
          if git diff --cached --quiet; then
            echo 'No hay cambios: mejora ya instalada o repositorio actualizado.'
            exit 0
          fi
          git diff --cached --name-only | grep -Fx 'report_delivery_gate.py'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'Garmin v2.4.14: immutable post-sleep certificates'
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'OK: certificado post-sueno instalado en main.'
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'ERROR: no hay confirmacion de publicacion en GitHub.' >&2
          exit 1

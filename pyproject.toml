[project]
name = "garmin-recovery"
version = "5.0.0"
description = "Seguimiento de recuperación y entrenamiento a partir de Garmin, Intervals.icu y RPE"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# Tests: nombres cortos (l), imports tras preparar sys.path y lambdas de apoyo son intencionados.
"test_*.py" = ["E741", "E402", "E731", "B905"]
